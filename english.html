<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Stream Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        /* 0% AI - Manual Styling */
        body { margin: 0; background: #000; height: 100vh; width: 100vw; overflow: hidden; }
        #player-box { width: 100%; height: 100%; position: relative; }
        video { width: 100%; height: 100%; }
        
        /* Shaka Player ke buttons ka size thoda bada dikhe app mein */
        .shaka-range-container { margin: 0 10px; }
    </style>
</head>
<body>

    <div id="player-box" data-shaka-player-container>
        <video id="video" data-shaka-player autoplay muted playsinline></video>
    </div>

    <script>
        // Manual Links
        const streamUrl = atob('aHR0cHM6Ly9qaW90dm1ibGl2ZS5jZG4uamlvLmNvbS9icGstdHYvU3BvcnRzMThfMV9IRF9CVFMvb3V0cHV0L2Rhc2gvU3BvcnRzMThfMV9IRF9CVFMubXBk');
        const k1 = atob('YjJjZjE1YmZkOTM4NDUyMTg4ZDQ1N2UzY2RjZTZlMDI=');
        const k2 = atob('MmI1N2VjNDM3YjcyNTdiNWFmMTY1ZDYzNGFlMmJmYzc=');
        const token = atob('c3Q9MTc3MTczNjQzNn5leHA9MTc3MTgyMjgzNn5hY2w9Lyp+aG1hYz04ZWM4MmJhYWRjNWVmZTY2ZjBkMTk2YzA4Nzc1ZDcxNGNjY2FjNmMzMmRiZjdjNjczOTJjMjEyYTE0NDVhMWY4');

        async function init() {
            const video = document.getElementById('video');
            const box = document.getElementById('player-box');
            
            const player = new shaka.Player(video);
            const ui = new shaka.ui.Overlay(player, box, video);
            
            // Fullscreen aur Mute button ko line mein rakhna
            ui.configure({
                'controlPanelElements': ['play_pause', 'spacer', 'mute', 'volume', 'fullscreen', 'overflow_menu']
            });

            player.configure({
                drm: { clearKeys: { [k1]: k2 } }
            });

            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['User-Agent'] = 'com.jio.jiotv/7.0.8 (Linux; Android 9) ExoPlayerLib/2.13.2';
                request.uris[0] += (request.uris[0].includes('?') ? '&' : '?') + "__hdnea__=" + token;
            });

            try {
                await player.load(streamUrl);
                // Video start ho jayegi lekin muted rahegi
                video.play();
            } catch (e) { console.log("Stream error"); }
        }

        document.addEventListener('shaka-ui-loaded', init);
    </script>
</body>
</html>
