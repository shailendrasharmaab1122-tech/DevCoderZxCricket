<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIVE | Assault Decoder Premium</title>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #3b82f6; --dark: #070b14; --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
        
        body { background: var(--dark); background-image: radial-gradient(circle at top right, #1e293b, #070b14); color: #fff; min-height: 100vh; display: flex; justify-content: center; padding: 15px; overflow-x: hidden; }
        
        .container { width: 100%; max-width: 900px; animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Header */
        .header { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 20px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-weight: 800; font-size: 1.3rem; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }
        
        .live-tag { background: rgba(239, 68, 68, 0.15); color: #ff4d4d; padding: 6px 12px; border-radius: 50px; font-weight: 700; font-size: 0.75rem; border: 1px solid rgba(239, 68, 68, 0.3); display: flex; align-items: center; gap: 6px; }
        .dot { height: 7px; width: 7px; background: #ff4d4d; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        /* Video Section - Enhanced for Rotation */
        .video-container { 
            position: relative; 
            width: 100%;
            aspect-ratio: 16/9; 
            background: #000; 
            border-radius: 22px; 
            overflow: hidden; 
            border: 1px solid var(--border);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        
        /* Force Landscape for App WebView when in Fullscreen */
        .video-container:-webkit-full-screen { width: 100%; height: 100%; border-radius: 0; }
        
        iframe { width: 100%; height: 100%; border: none; }

        /* Action Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
        .card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 20px; text-align: center; backdrop-filter: blur(10px); }
        
        .btn { 
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; 
            width: 100%; padding: 14px; margin-top: 10px; 
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); 
            color: white; text-decoration: none; border-radius: 14px; 
            font-weight: 600; border: none; cursor: pointer; transition: 0.3s;
        }
        .btn:active { transform: scale(0.96); }

        /* Security Shield */
        body { -webkit-user-select: none; user-select: none; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <header class="header">
        <div class="logo">Assault <span>Decoder</span></div>
        <div class="live-tag"><div class="dot"></div> LIVE NOW</div>
    </header>

    <div class="video-container" id="vidBox">
        <iframe id="player" src="about:blank" allow="autoplay; encrypted-media; gyroscope; accelerometer; picture-in-picture" allowfullscreen></iframe>
    </div>

    <div class="grid">
        <div class="card">
            <button onclick="_tg()" class="btn"><i class="fa-brands fa-telegram"></i> Telegram</button>
        </div>
        <div class="card">
            <button id="sh" class="btn"><i class="fa-solid fa-share-nodes"></i> Share</button>
        </div>
    </div>
</div>

<script>
    /* Hex-Encoded Links for Protection */
    const _0x5f = [
        "\x68\x74\x74\x70\x73\x3A\x2F\x2F\x64\x65\x76\x63\x6F\x64\x65\x72\x7A\x78\x63\x72\x69\x63\x6B\x65\x74\x2E\x76\x65\x72\x63\x65\x6C\x2E\x61\x70\x70\x2F\x70\x72\x69\x6E\x63\x65\x2E\x6D\x79\x2E\x73\x6F\x6E\x2E\x68\x74\x6D\x6C", 
        "\x68\x74\x74\x70\x73\x3A\x2F\x2F\x74\x2E\x6D\x65\x2F\x43\x72\x69\x63\x5F\x64\x65\x63\x6F\x64\x65\x72\x73"
    ];

    const frame = document.getElementById('player');
    frame.src = _0x5f[0];

    function _tg() { window.open(_0x5f[1], "_blank"); }

    /* --- ROTATION FIX FOR APPS --- */
    function requestRotation() {
        const doc = document.documentElement;
        if (doc.requestFullscreen) {
            // Try locking orientation
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(e => console.log("Manual rotation needed"));
            }
        }
    }

    // Listen for Fullscreen event from Frame
    window.addEventListener('message', function(e) {
        if (e.data === 'requestFullScreen') {
            requestRotation();
        }
    });

    // Share Logic
    document.getElementById('sh').addEventListener('click', async () => {
        if (navigator.share) await navigator.share({title: 'Live Stream', url: window.location.href});
    });

    // Disable DevTools
    document.onkeydown = (e) => {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false;
    };
</script>

</body>
</html>
