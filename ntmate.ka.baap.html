<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderZ X Cricket</title>
    <style>
        /* Manually Optimized Styles */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505; /* Deep black for better contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        #main-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Responsive Frame Wrapper */
        .frame-inner {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* Professional Overlay (Optional: remove if not needed) */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: -1; /* Behind the frame */
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
        }
    </style>
</head>
<body>

    <div id="main-container">
        <div class="loading-overlay">Initializing Stream...</div>
        
        <iframe 
            class="frame-inner"
            src="https://waptv.wapka.xyz/hindi" 
            allow="autoplay; encrypted-media; fullscreen" 
            sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts allow-top-navigation"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        // Log status to console just like a dev would
        console.log("Stream Container Initialized...");
        
        // Prevent accidental right clicks on the page
        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>

</body>
</html>
