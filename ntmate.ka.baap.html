<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevCoderZ X Cricket - Full Fixed</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #000; overflow: hidden;
      font-family: sans-serif;
    }
    #video-container { width: 100%; height: 100%; }
    video { width: 100%; height: 100%; }
    /* Spinner hide */
    .shaka-spinner-container { display: none !important; }
    #status {
      position: absolute; top: 10px; left: 10px;
      color: white; background: rgba(0,0,0,0.5);
      padding: 5px 10px; border-radius: 5px; z-index: 10;
      font-size: 12px; pointer-events: none;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="status">Status: Initializing...</div>

  <div id="video-container" data-shaka-player-container>
    <video autoplay playsinline id="main-video" data-shaka-player></video>
  </div>

  <script>
    // 1. FRESH TOKENS & URL (Make sure these are current)
    const streamUrl = "https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd?__hdnea__=st=1771529762~exp=1771616162~acl=/*~hmac=cf31360fadcb5ea2c9771bece88d82d4b2a6e81d44ff5d80d22aec7ddaabc21c";
    const activeCookie = "hdnea=st=1770968162/exp=1771054562/acl=/*~hmac=a20b369ce7b0b48ea6f53ecd616f0e94ba595042495610cae245fed7b640c883";

    async function startPlayer() {
      const status = document.getElementById('status');
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        status.innerText = "Error: Browser Not Supported";
        return;
      }

      const video = document.getElementById('main-video');
      const container = document.getElementById('video-container');
      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'quality', 'fullscreen']
      });

      // 2. DRM KEYS (Check if these are still valid)
      player.configure({
        drm: {
          clearKeys: {
            "400131994b445d8c8817202248760fda": "2d56cb6f07a75b9aff165d534ae2bfc4"
          }
        },
        streaming: {
          lowLatencyMode: true,
          jumpLargeGaps: true
        }
      });

      // 3. NETWORKING FILTER (Fixing Black Screen & Auth)
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // Adding mandatory Jio headers
        request.headers['Referer'] = 'https://www.jiotv.com/';
        request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13)';
        request.headers['Cookie'] = activeCookie;

        // Append token to all segment requests if not present
        if (request.uris[0] && !request.uris[0].includes('__hdnea=')) {
          const separator = request.uris[0].includes('?') ? '&' : '?';
          request.uris[0] += separator + activeCookie;
        }
      });

      // 4. LOAD STREAM
      try {
        await player.load(streamUrl);
        status.innerText = "Status: Playing...";
        console.log("Stream Loaded!");
      } catch (error) {
        status.innerText = "Error: " + error.code;
        console.error("Error Detail:", error);
      }
    }

    // Block F12 and shortcuts
    document.onkeydown = (e) => {
      if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
        return false;
      }
    };

    document.addEventListener('shaka-ui-loaded', startPlayer);
  </script>

</body>
</html>
