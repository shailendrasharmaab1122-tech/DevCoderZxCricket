<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DevCoderZ X Cricket</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body { background: #000; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #player-container { width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; }
        /* Loader hide karne ke liye agar zaroorat ho */
        .shaka-spinner-container { display: none !important; }
    </style>
</head>
<body>

<div data-shaka-player-container id="player-container">
    <video id="video" autoplay playsinline></video>
</div>

<script>
    const manifest = "https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
    
    const keys = {
        "400131994b445d8c8817202248760fda": "2d56cb6f07a75b9aff165d534ae2bfc4"
    };

    let auth = "hdnea=st=1770968162/exp=1771054562/acl=/*~hmac=a20b369ce7b0b48ea6f53ecd616f0e94ba595042495610cae245fed7b640c883";

    async function setup() {
        shaka.polyfill.installAll();
        
        const video = document.getElementById('video');
        const container = document.getElementById('player-container');
        const player = new shaka.Player(video);
        const ui = new shaka.ui.Overlay(player, container, video);

        player.configure({
            drm: { clearKeys: keys },
            streaming: { lowLatencyMode: true }
        });

        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['Referer'] = 'https://www.jiotv.com/';
            request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
            request.headers['Cookie'] = auth;

            if (!request.uris[0].includes('hdnea')) {
                const q = request.uris[0].includes('?') ? '&' : '?';
                request.uris[0] += q + auth;
            }
        });

        try {
            await player.load(manifest);
        } catch (e) {
            console.error('load_fail', e);
        }
    }

    document.addEventListener('shaka-ui-loaded', setup);
</script>

</body>
</html>
