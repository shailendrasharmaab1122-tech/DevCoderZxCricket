<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DevCoderZ X Cricket</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #player-container { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div data-shaka-player-container id="player-container">
    <video id="video" autoplay playsinline></video>
</div>

<script>
    // 1. Fresh URL aur Token yahan check karein
    const manifest = "https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
    const keys = { "400131994b445d8c8817202248760fda": "2d56cb6f07a75b9aff165d534ae2bfc4" };
    let auth = "hdnea=st=1771529762~exp=1771616162~acl=/*~hmac=cf31360fadcb5ea2c9771bece88d82d4b2a6e81d44ff5d80d22aec7ddaabc21c";

    async function setup() {
        shaka.polyfill.installAll();
        const video = document.getElementById('video');
        const container = document.getElementById('player-container');
        const player = new shaka.Player(video);
        const ui = new shaka.ui.Overlay(player, container, video);

        player.configure({
            drm: { clearKeys: keys },
            streaming: { 
                rebufferingGoal: 10,
                bufferingGoal: 30 
            }
        });

        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            // Jio Authentication Headers
            request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
            
            // Token ko URL ke peeche lagana zaroori hai segments ke liye
            if (request.uris[0].includes('jiotvmblive.cdn.jio.com')) {
                const separator = request.uris[0].includes('?') ? '&' : '?';
                if (!request.uris[0].includes('hdnea')) {
                    request.uris[0] += separator + auth;
                }
            }
        });

        try {
            await player.load(manifest);
            console.log("Success!");
        } catch (e) {
            console.error("Error Code: " + e.code);
            // Agar 1001 error hai toh URL/Token galat hai
            // Agar 1002 error hai toh CORS block hai
        }
    }

    document.addEventListener('shaka-ui-loaded', setup);
</script>
</body>
</html>
