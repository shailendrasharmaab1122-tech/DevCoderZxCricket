<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevCoderZ X Cricket</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        background: #000;
        height: 100%;
        width: 100%;
        overflow: hidden;
    }
    #video-container {
        width: 100%;
        height: 100%;
    }
    video {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }
    /* Spinner hide karne ke liye */
    .shaka-spinner-container { display: none !important; }
</style>
</head>
<body>

<div id="video-container" data-shaka-player-container>
    <video id="video" data-shaka-player autoplay playsinline muted></video>
</div>

<script>
async function initPlayer() {
    // Install Polyfills
    shaka.polyfill.installAll();

    const video = document.getElementById('video');
    const container = document.getElementById('video-container');

    // Shaka Player setup
    const player = new shaka.Player(video);
    const ui = new shaka.ui.Overlay(player, container, video);

    // Aapka DASH link
    const manifestUri = 'https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/dash/Star_Sports_HD1_Hindi_BTS-audio_98834_hin=98800-85034706461952.dash?__hdnea__=st=1771550189~exp=1771636589~acl=/*~hmac=0514601e05baa981c7d7519bf824c76275d663393d8b1cab20015d37e6d11de3';

    // Error handling
    player.addEventListener('error', (event) => {
        console.error("Error code", event.detail.code, "object", event.detail);
    });

    try {
        await player.load(manifestUri);
        console.log("Stream loaded successfully!");
    } catch (e) {
        console.error("Error loading stream", e);
    }
}

// UI load hone par initialize karein
document.addEventListener('shaka-ui-loaded', initPlayer);
</script>

</body>
</html>
