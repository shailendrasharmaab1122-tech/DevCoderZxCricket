<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player - Devansh Sharma</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body { margin: 0; background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; width: 100vw; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #player-container { width: 100%; height: 100%; position: relative; }
        video { width: 100%; height: 100%; }
        
        /* Premium Glowing Name Tag */
        .dev-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            pointer-events: none;
            text-shadow: 0 0 10px #00d2ff, 0 0 20px #00d2ff, 0 0 40px #00d2ff;
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes pulse-glow {
            from { opacity: 0.7; text-shadow: 0 0 5px #fff, 0 0 10px #00d2ff; }
            to { opacity: 1; text-shadow: 0 0 15px #fff, 0 0 30px #00d2ff, 0 0 45px #00d2ff; }
        }

        .shaka-spinner-container { display: none !important; }
    </style>
</head>
<body>

<div id="player-container" data-shaka-player-container>
    <div class="dev-tag">Developer - Devansh Sharma</div>
    
    <video id="video" data-shaka-player autoplay playsinline></video>
</div>

<script>
const manifestUri = "https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
const token = "st=1771723196~exp=1771809596~acl=/*~hmac=f4b94368c5903727f68360e98f196dc1583d8757be20ae10c5b2beaad4e5580a";

async function initPlayer() {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) return;

    const video = document.getElementById('video');
    const container = document.getElementById('player-container');
    const player = new shaka.Player(video);

    const ui = new shaka.ui.Overlay(player, container, video);
    ui.configure({
        'controlPanelElements': ['play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'quality', 'fullscreen']
    });

    player.configure({
        drm: {
            clearKeys: {
                "400131994b445d8c8817202248760fda": "2d56cb6f07a75b9aff165d534ae2bfc4"
            }
        }
    });

    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        request.headers['Referer'] = 'https://www.jiotv.com/';
        const connector = request.uris[0].includes('?') ? '&' : '?';
        request.uris[0] += connector + "__hdnea__=" + token;
    });

    try {
        await player.load(manifestUri);
    } catch (e) {
        console.error("Load failed:", e.code);
    }
}

document.addEventListener('shaka-ui-loaded', initPlayer);
</script>

</body>
</html>
