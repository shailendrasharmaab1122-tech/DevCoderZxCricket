<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Page - DevCoderz X Cricket</title>
<style>
  body { margin:0; padding:0; background:#000; }
  #player-container { width:100%; height:500px; background:#000; }
</style>
</head>
<body>

<h1 style="color:white; text-align:center;">Parent Page Example</h1>

<!-- Video iframe container -->
<div id="player-container"></div>

<script>
  // Create iframe dynamically
  var iframe = document.createElement('iframe');
  iframe.src = "iframe_player.html"; // iframe page (Shaka Player)
  iframe.allow = "autoplay; encrypted-media";
  iframe.allowFullscreen = true;
  iframe.style.width = '100%';
  iframe.style.height = '100%'; // visible
  iframe.style.border = 'none';
  document.getElementById('player-container').appendChild(iframe);
</script>

</body>
</html>
