<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevCoderZ - Stream Engine</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
<style>
    body{margin:0;background:#000;height:100vh;width:100vw;overflow:hidden;font-family:sans-serif;}
    #player-container{width:100%;height:100%;position:relative;}
    video{width:100%;height:100%;object-fit:contain;}
    
    /* Invisible Shield jo user ke pehle touch ko pakad legi */
    #unmute-shield{
        position:absolute;top:0;left:0;width:100%;height:100%;
        z-index:100;cursor:pointer;
        background: rgba(0,0,0,0.01); /* Bilkul invisible */
    }
    
    .dev-tag{position:absolute;top:20px;left:20px;z-index:99;color:#fff;font-weight:bold;font-size:14px;text-shadow:0 0 10px #00d2ff;pointer-events:none;}
</style>
</head>
<body>

<div id="player-container" data-shaka-player-container>
    <div class="dev-tag">Developer - Devansh Sharma</div>
    <div id="unmute-shield"></div> 
    <video id="video" data-shaka-player autoplay muted playsinline></video>
</div>

<script>

async function init(){
    shaka.polyfill.installAll();
    var v = document.getElementById('video');
    var c = document.getElementById('player-container');
    var s = document.getElementById('unmute-shield');
    var p = new shaka.Player(v);
    
    // UI controls hide karne ke liye agar zaroorat ho
    new shaka.ui.Overlay(p, c, v);

    p.configure({
        drm:{clearKeys:{[_d(_0x5)]:_d(_0x6)}},
        streaming:{lowLatencyMode:true,bufferingGoal:5}
    });

        r.headers['User-Agent']=_d(_0x2);
        r.headers['Referer']=_d(_0x3);
        r.uris[0]+=(r.uris[0].includes('?')?'&':'?')+"__hdnea__="+_d(_0x4);
    });

    try {
        await p.load(_d(_0x1));
        
        // Asli Jadoo: User screen pe kahin bhi click karega, video unmute ho jayegi
        s.addEventListener('click', function(){
            v.muted = false;
            v.volume = 1.0;
            v.play(); // Double check for play
            s.style.display = 'none'; // Shield gayab
        });
    } catch(e){console.log('Error');}
}

document.addEventListener('shaka-ui-loaded', init);
</script>
</body>
</html>
