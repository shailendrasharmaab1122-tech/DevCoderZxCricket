<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderZ X Cricket</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: #000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .shaka-video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        video {
            width: 100%;
            height: 100%;
            background: #000;
            object-fit: contain;
        }
        /* Spinner hide kiya hai jaisa tune manga tha */
        .shaka-spinner-container,
        .shaka-spinner,
        .shaka-spinner-svg {
            display: none !important;
        }
    </style>
</head>
<body>

<div data-shaka-player-container class="shaka-video-container">
    <video id="video" autoplay playsinline></video>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) return;

    const video = document.getElementById('video');
    const player = new shaka.Player();
    await player.attach(video);

    const container = document.querySelector('.shaka-video-container');
    const ui = new shaka.ui.Overlay(player, container, video);

    ui.configure({
        controlPanelElements: [
            'play_pause','time_and_duration','mute','volume',
            'spacer','language','captions','picture_in_picture',
            'quality','fullscreen'
        ],
        seekBarColors: {
            base: 'white',
            buffered: 'red',
            played: 'green'
        }
    });

    // DRM Keys
    let drmConfig = {
        clearKeys: {
            "400131994b445d8c8817202248760fda": "2d56cb6f07a75b9aff165d534ae2bfc4"
        }
    };

    // Default headers/url
    let cookieHeader = "hdnea=st=1770968162/exp=1771054562/acl=/*~hmac=a20b369ce7b0b48ea6f53ecd616f0e94ba595042495610cae245fed7b640c883";
    let streamUrl = "https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";

    // Auto-fetch fresh cookie logic
    try {
        const response = await fetch('https://allrounderid.pages.dev/api/jiotv2.json');
        const data = await response.json();
        // Star Sports 1 Hindi ke liye search filter
        const channel = data.find(ch => ch.channel_name === "Star Sports 1 Hindi" || ch.channel_name === "DD Sports");
        if (channel && channel.cookie) {
            cookieHeader = channel.cookie;
        }
    } catch (e) {
        console.log("api_fail_using_default");
    }

    player.configure({
        drm: drmConfig,
        streaming: {
            lowLatencyMode: true,
            jumpLargeGaps: true
        }
    });

    // Network filters for Jio security
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['Referer'] = 'https://www.jiotv.com/';
        request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        request.headers['Cookie'] = cookieHeader;

        if ((type === shaka.net.NetworkingEngine.RequestType.MANIFEST ||
             type === shaka.net.NetworkingEngine.RequestType.SEGMENT) &&
            request.uris[0] && !request.uris[0].includes('__hdnea=')) {
            const sep = request.uris[0].includes('?') ? '&' : '?';
            request.uris[0] += sep + cookieHeader;
        }
    });

    // Reload logic on error
    player.addEventListener('error', async (event) => {
        if (event.detail.code === 403 || event.detail.code === 401) {
            console.log("auth_error_retrying...");
            // Yahan backup cookie ka fetch daal sakte ho agar zaroorat ho
        }
    });

    try {
        await player.load(streamUrl);
    } catch (e) {
        console.error("load_error", e);
    }
});
</script>

</body>
</html>
