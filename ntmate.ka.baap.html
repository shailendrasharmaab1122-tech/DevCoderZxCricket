<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevCoderZ X Cricket</title>

  <!-- Shaka Player -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

  <style>
    /* Reset and container */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /* Completely hide progress bar, time, volume, controls, spinner */
    .shaka-seek-bar-container,
    .shaka-seek-bar,
    .shaka-current-time,
    .shaka-duration,
    .shaka-ad-markers,
    .shaka-volume-bar-container,
    .shaka-mute-button,
    .shaka-play-button,
    .shaka-rewind-button,
    .shaka-fastforward-button,
    .shaka-fullscreen-button,
    .shaka-settings-menu-button,
    .shaka-caption-button,
    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg,
    .shaka-controls-container {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="shaka-video-container shaka-mobile" data-shaka-player-container="" shaka-controls="true">
    <video autoplay playsinline preload="metadata" class="shaka-video" id="video"></video>
  </div>

<script>
  // Initialize Shaka Player
  document.addEventListener('DOMContentLoaded', async () => {
    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {
      alert('Browser not supported!');
      return;
    }

    const video = document.getElementById('video');
    const player = new shaka.Player(video);

    // Example manifest (replace with your own)
    const manifestUri = 'https://path-to-your-video/manifest.mpd';

    try {
      await player.load(manifestUri);
      console.log('Video loaded successfully!');
    } catch (e) {
      console.error('Error loading video', e);
    }
  });
</script>
</body>
</html>
