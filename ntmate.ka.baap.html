<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderZ X Cricket</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; height: 100vh; width: 100vw; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        /* Fixed Container */
        #container {
            width: 100%;
            height: 100%;
            background: #000;
        }
        video {
            width: 100%;
            height: 100%;
        }

        /* Spinner aur extra elements hide */
        .shaka-spinner-container { display: none !important; }
        
        /* Seek bar styling as per your choice */
        .shaka-seek-bar-container { height: 6px !important; }
    </style>
</head>
<body>

<div id="container" data-shaka-player-container>
    <video id="video" data-shaka-player autoplay playsinline></video>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    shaka.polyfill.installAll();
    if (!shaka.Player.isBrowserSupported()) return;

    const video = document.getElementById('video');
    const container = document.getElementById('container');
    const player = new shaka.Player(video);

    // UI Overlay setup - No duplicate containers
    const ui = new shaka.ui.Overlay(player, container, video);
    ui.configure({
        controlPanelElements: [
            'play_pause', 'time_and_duration', 'spacer', 'mute', 'volume', 'quality', 'fullscreen'
        ],
        seekBarColors: {
            base: 'rgba(255,255,255,0.3)',
            buffered: 'rgba(255,255,255,0.5)',
            played: 'green'
        }
    });

    // DRM Config
    let drmConfig = {
        clearKeys: {
            "400131994b445d8c8817202248760fda": "2d56cb6f07a75b9aff165d534ae2bfc4"
        }
    };

    // Jio Stream Config
    let streamUrl = "https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
    let cookieHeader = "hdnea=st=1770968162/exp=1771054562/acl=/*~hmac=a20b369ce7b0b48ea6f53ecd616f0e94ba595042495610cae245fed7b640c883";

    // Auto-fetch fresh cookie logic (No changes here)
    try {
        const response = await fetch('https://allrounderid.pages.dev/api/jiotv2.json');
        const data = await response.json();
        const ch = data.find(c => c.channel_name === "Star Sports 1 Hindi");
        if (ch && ch.cookie) cookieHeader = ch.cookie;
    } catch (e) {}

    player.configure({ drm: drmConfig });

    // Request Filter for Security Bypass
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['Referer'] = 'https://www.jiotv.com/';
        request.headers['User-Agent'] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
        request.headers['Cookie'] = cookieHeader;

        if (type === shaka.net.NetworkingEngine.RequestType.MANIFEST || type === shaka.net.NetworkingEngine.RequestType.SEGMENT) {
            if (!request.uris[0].includes('__hdnea=')) {
                const sep = request.uris[0].includes('?') ? '&' : '?';
                request.uris[0] += sep + cookieHeader;
            }
        }
    });

    try {
        await player.load(streamUrl);
        console.log("Stream Loaded!");
    } catch (e) {
        console.error("Load failed", e);
    }
});
</script>

</body>
</html>
