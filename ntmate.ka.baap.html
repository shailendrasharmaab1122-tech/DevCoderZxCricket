<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Player - JioTV</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Container to isolate UI and prevent progress bar clash */
        .video-wrapper {
            width: 100%;
            height: 500px; /* Aap ise 100vh bhi kar sakte hain full screen ke liye */
            background: #000;
            position: relative;
        }

        #video { width: 100%; height: 100%; }

        .status-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            z-index: 10;
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
    </style>
</head>
<body>

<div class="video-wrapper" id="player-container" data-shaka-player-container>
    <video id="video" data-shaka-player autoplay playsinline muted></video>
    <div id="status" class="status-msg">Link Expired! Please use a fresh JioTV Link.</div>
</div>

<script>
async function initPlayer() {
    shaka.polyfill.installAll();
    
    const video = document.getElementById('video');
    const container = document.getElementById('player-container');
    const status = document.getElementById('status');

    // Player and UI Setup
    const player = new shaka.Player(video);
    const ui = new shaka.ui.Overlay(player, container, video);
    
    // Config for JioTV (Retries for better stability)
    player.configure({
        streaming: { bufferingGoal: 30 },
        manifest: { retryParameters: { maxAttempts: 3 } }
    });

    // --- YAHAN NAYA LINK DALEIN ---
    const freshJioUri = 'https://waptv.wapka.xyz/hindi';

    // Test Link (Check karne ke liye ki player sahi hai ya nahi)
    const testUri = 'https://storage.googleapis.com/shaka-demo-assets/angel-one/dash.mpd';

    try {
        // Sabse pehle aapka Jio link try karega
        await player.load(freshJioUri);
        console.log("Jio Stream Loaded!");
    } catch (e) {
        console.error("Error code", e.code);
        status.style.display = 'block'; // Error dikhayega
        
        // Agar aap chahte hain ki player fail na ho aur test video chal jaye:
        // await player.load(testUri); 
        // status.style.display = 'none';
    }
}

document.addEventListener('shaka-ui-loaded', initPlayer);
</script>

</body>
</html>
