<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASH Player | Devansh</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }

        #video-container {
            width: 100%;
            height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
        }

        #loading-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            font-size: 16px;
            z-index: 5;
        }
    </style>
</head>
<body>

<div id="video-container" data-shaka-player-container>
    <div id="loading-overlay">Initializing Stream...</div>
    <video id="video" data-shaka-player autoplay playsinline poster="https://ik.imagekit.io/24sfhkkep/shwe7ank-poster-16x9.png"></video>
</div>

<script>
async function initApp() {
    const video = document.getElementById('video');
    const container = document.getElementById('video-container');
    const loading = document.getElementById('loading-overlay');

    // Install polyfills to patch browser gaps
    shaka.polyfill.installAll();

    if (!shaka.Player.isBrowserSupported()) {
        loading.textContent = "Browser not supported!";
        return;
    }

    const player = new shaka.Player(video);
    const ui = new shaka.ui.Overlay(player, container, video);

    // Stream & Keys Configuration
    const manifestUri = "https://live-pv-ta.amazon.fastly-edge.com/lhr-nitro/live/clients/dash/enc/wwrmho82pc/out/v1/d7130f460d41486ea7e8e3eb45f0522f/cenc.mpd";

    player.configure({
        drm: {
            clearKeys: {
                "baafdb8ebcbbc0655332291da6f121da": "60ac892e0ea0b2c46fc6837c97ed641a"
            }
        },
        streaming: {
            lowLatencyMode: true,
            bufferingGoal: 5,
            jumpLargeGaps: true
        }
    });

    try {
        await player.load(manifestUri);
        loading.style.display = 'none';
        console.log("Stream Loaded Successfully");
    } catch (e) {
        console.error("Error Loading:", e);
        loading.textContent = "Stream/Keys Expired or Blocked";
        loading.style.color = "red";
    }
}

document.addEventListener('shaka-ui-loaded', initApp);
</script>

</body>
</html>
