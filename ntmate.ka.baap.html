<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #video-container { width: 100%; height: 100%; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: sans-serif; }
    </style>
</head>
<body>

<div id="video-container" data-shaka-player-container>
    <video id="video" data-shaka-player autoplay playsinline style="width:100%;height:100%"></video>
    <div id="loading">Loading...</div>
</div>

<script>
async function initPlayer() {
    const video = document.getElementById('video');
    const player = new shaka.Player(video);
    const ui = new shaka.ui.Overlay(player, document.getElementById('video-container'), video);

    player.configure({
        drm: {
            clearKeys: {
                "baafdb8ebcbbc0655332291da6f121da": "60ac892e0ea0b2c46fc6837c97ed641a"
            }
        }
    });

    try {
        await player.load("https://live-pv-ta.amazon.fastly-edge.com/lhr-nitro/live/clients/dash/enc/wwrmho82pc/out/v1/d7130f460d41486ea7e8e3eb45f0522f/cenc.mpd");
        document.getElementById('loading').style.display = 'none';
    } catch (e) {
        document.getElementById('loading').textContent = "Link/Keys Expired";
    }
}
document.addEventListener('shaka-ui-loaded', initPlayer);
</script>

</body>
</html>
