<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevCoderZ X Cricket | Live Stream</title>
    <script src="https://ajax.googleapis.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body {
            background-color: #0f172a; /* Dark Navy Blue Theme */
            color: #38bdf8; /* Neon Blue */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            border: 2px solid #38bdf8;
            border-radius: 15px;
            padding: 20px;
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { margin-bottom: 20px; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        video {
            width: 100%;
            max-width: 854px;
            border-radius: 8px;
            outline: none;
            background: #000;
        }
        .status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ DevCoderZ X Cricket ⚡</h1>
        
        <video id="video" poster="https://i.imgur.com/8Nn3lXn.png" controls autoplay></video>
        
        <div class="status" id="status">Status: Connecting to Stream...</div>
    </div>

    <script>
        async function initApp() {
            shaka.polyfill.installAll();
            const video = document.getElementById('video');
            const player = new shaka.Player(video);
            const statusBox = document.getElementById('status');

            player.addEventListener('error', (e) => {
                console.error('Shaka Error:', e.detail);
                statusBox.innerText = "Status: Stream Error (Token Expired or CORS)";
                statusBox.style.color = "#ef4444";
            });

            try {
                // Aapka dynamic link yahan
                const manifestUri = 'https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd?__hdnea__=st=1771529762~exp=1771616162~acl=/*~hmac=cf31360fadcb5ea2c9771bece88d82d4b2a6e81d44ff5d80d22aec7ddaabc21c';
                
                await player.load(manifestUri);
                statusBox.innerText = "Status: Live Now 🔴";
                statusBox.style.color = "#22c55e";
            } catch (e) {
                console.error('Load Failed', e);
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
