<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live Stream</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
<style>
    body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:sans-serif}
    #vid_container{width:100%;height:100%;position:relative}
    video{width:100%;height:100%}
    .overlay_dev{position:absolute;top:15px;left:15px;z-index:9;background:rgba(0,0,0,0.5);padding:6px 12px;border-radius:4px;border:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;pointer-events:none}
    .live_dot{height:7px;width:7px;background:#00f0ff;border-radius:50%;margin-right:8px;box-shadow:0 0 8px #00f0ff}
    .dev_name{color:#ddd;font-size:11px;letter-spacing:1px;font-weight:600}
    .dev_name span{color:#00f0ff}
    #gate_screen{position:absolute;inset:0;background:#0a0a0a;display:flex;justify-content:center;align-items:center;z-index:99}
    .play_box{text-align:center;cursor:pointer}
    .p_icon{font-size:45px;color:#fff;background:#1a3eb3;width:85px;height:85px;line-height:85px;border-radius:50%;margin:0 auto 15px;display:block;box-shadow:0 10px 20px rgba(0,0,0,0.3)}
    .p_msg{color:#fff;font-size:14px;letter-spacing:1px}
    .shaka-spinner-container{display:none!important}
</style>
</head>
<body oncontextmenu="return false">

<div id="vid_container" data-shaka-player-container>
    <div class="overlay_dev">
        <div class="live_dot"></div>
        <div class="dev_name">DEVELOPER <span>DEVANSH SHARMA</span></div>
    </div>

    <div id="gate_screen">
        <div class="play_box" id="trigger">
            <i class="p_icon">▶</i>
            <span class="p_msg">CLICK TO PLAY LIVE</span>
        </div>
    </div>

    <video id="main_vid" data-shaka-player autoplay playsinline></video>
</div>

<script>
(function(){
    // Raw obfuscated strings - Layer 1
    var _0xURL = "YUhSMGNITTZMeTlrWlhadmRubHdjMjF2WWk1amRIUjVjbWx2TG1OdmJTOVljR3N0ZEhZdVVISnZjbVJOYVZKek1VaEVSRjk0VTFCNWNIUnpNVTFGUkZOVWRIUnBaMnhsY3k5cGJuUmxlQzV0Y0dRO19faGRuZWFfXz1zdD0xNzcyMDg3NDAzfmV4cD0xNzcyMTczODAzfmFjbD0vKn5obWFjPTIwYzgwYzk2NmVkMzllNWI1YTkwYTFkMDcxNzE2OTk0MjUwNmNmMGQwMzFhY2NhOWY5ZmUyOTA4MjlhMzk5NTM=";
    var _0xK1 = "YjJjZjE1YmZkOTM4NDUyMTg4ZDQ1N2UzY2RjZTZlMDI=";
    var _0xK2 = "MmI1N2VjNDM3YjcyNTdiNWFmMTY1ZDYzNGFlMmJmYzc=";

    async function _initApp(){
        var v = document.getElementById('main_vid');
        var c = document.getElementById('vid_container');
        var t = document.getElementById('trigger');
        var s = document.getElementById('gate_screen');

        var p = new shaka.Player(v);
        new shaka.ui.Overlay(p, c, v);

        // DRM config
        p.configure({
            drm: { clearKeys: { [atob(_0xK1)]: atob(_0xK2) } }
        });

        // Request handler
        p.getNetworkingEngine().registerRequestFilter(function(type, request){
            var parts = atob(_0xURL).split(';');
            var uri = request.uris[0];
            request.uris[0] = uri + (uri.includes('?') ? '&' : '?') + parts[1];
        });

        try {
            var fullUrl = atob(_0xURL).split(';')[0];
            await p.load(fullUrl);
            t.onclick = function(){
                v.muted = false;
                s.style.display = 'none';
                v.play();
            };
        } catch(e) { 
            console.log('err', e);
        }
    }

    document.addEventListener('shaka-ui-loaded', _initApp);
})();
</script>
</body>
</html>
