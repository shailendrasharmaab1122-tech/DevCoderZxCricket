<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DevCoderz X Assault Decoder">
<meta name="theme-color" content="#ffffff">
<title>DevCoderz X Assault Decoder // Live Stream</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --bg-gradient: linear-gradient(to bottom, #ffffff 0%, #f1f5f9 100%);
    --glass-bg: rgba(255, 255, 255, 0.75);
    --glass-border: rgba(0, 0, 0, 0.08);
    --glass-blur: blur(20px);
    --glass-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
    --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    --text-primary: #1e293b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Outfit', sans-serif;
}

body {
    background: var(--bg-gradient);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 1.5rem;
}

.container {
    width: 100%;
    max-width: 1100px;
    animation: slideUpFade 0.8s ease forwards;
}

@keyframes slideUpFade {
    from {opacity: 0; transform: translateY(30px);}
    to {opacity: 1; transform: translateY(0);}
}

.stream-header {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--glass-shadow);
    margin-bottom: 1.5rem;
}

.live-badge {
    background: rgba(239,68,68,0.1);
    color: #dc2626;
    padding: 0.4rem 1rem;
    border-radius: 30px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

#player-container {
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
}

.grid-panels {
    margin-top: 2rem;
    display: grid;
    gap: 1.5rem;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}

.info-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    box-shadow: var(--glass-shadow);
}

.action-button {
    margin-top: 1rem;
    display: flex;
    justify-content: center;
    gap: 0.75rem;
    padding: 1rem;
    background: var(--accent-gradient);
    color: #fff;
    border-radius: 12px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body oncontextmenu="return false">

<main class="container">
    <div class="stream-header">
        <h1>DevCoderz X Assault Decoder</h1>
        <span class="live-badge"><i class="fa-solid fa-circle"></i> LIVE NOW</span>
    </div>

    <!-- Iframe container -->
    <div id="player-container"></div>

    <div class="grid-panels">
        <div class="info-card">
            <h2>📣 Follow us for updates</h2>
            <a href="https://t.me/Cric_decoders" target="_blank" class="action-button">
                <i class="fa-brands fa-telegram"></i> Join Telegram
            </a>
        </div>
        <div class="info-card">
            <h2><i class="fa-solid fa-share-nodes"></i> Share Stream</h2>
            <button class="action-button" id="shareButton" onclick="copyURL()">Copy Stream Link ❤️</button>
        </div>
    </div>
</main>

<script>
// Embed the iframe
(function() {
    // URL to iframe page (ntmate.ka.baap.html)
    var encoded = "aHR0cHM6Ly9kZXZjb2Rlcnp4Y3JpY2tldC52ZXJjZWwuYXBwL250bWF0ZS5rYS5iYWFwLmh0bWw=";
    var url = atob(encoded);
    var iframe = document.createElement('iframe');
    iframe.src = url;
    iframe.allow = "encrypted-media; autoplay";
    iframe.allowFullscreen = true;
    document.getElementById('player-container').appendChild(iframe);
})();

// Copy URL
function copyURL() {
    navigator.clipboard.writeText(window.location.href);
    alert("Link Copied! Share it with friends. ✅");
}

// Optional Anti-Inspect
document.addEventListener('keydown', function(e) {
    if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key==='U')){
        e.preventDefault();
    }
});
</script>

</body>
</html>
