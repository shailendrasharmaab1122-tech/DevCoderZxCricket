<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { background:#000; width:100%; height:100%; font-family: system-ui, -apple-system, sans-serif; overflow:hidden; }

    /* Glowing Developer Name */
    .glow-developer {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(14px, 1.5vw, 18px);
      font-weight: bold;
      color: #1e90ff;
      text-shadow: 0 0 3px #1e90ff, 0 0 5px #1e90ff, 0 0 10px #00ffff;
      z-index: 9999;
      pointer-events: none;
    }

    /* Video Container */
    .shaka-video-container {
      position:absolute;
      inset:0;
      display:none;
      width:100%;
      height:100%;
    }

    video { width:100%; height:100%; object-fit:contain; background:#000; }

    /* Telegram Popup */
    .popup-overlay {
      position:absolute; inset:0; background:rgba(0,0,0,0.85); z-index:9998; display:flex;
      flex-direction:column; justify-content:center; align-items:center; color:#fff; text-align:center;
    }
    .popup-button, .popup-skip {
      margin-top:20px; padding:10px 25px; font-size:16px; font-weight:bold; border:none; cursor:pointer; border-radius:6px; transition:.3s;
    }
    .popup-button { background:#1e90ff; color:#fff; }
    .popup-button:hover { background:#00ffff; color:#000; }
    .popup-skip { background:transparent; color:#fff; text-decoration:underline; }

    /* Shaka Player progress bar (single) */
    .shaka-seek-bar-container {
      position: absolute !important;
      top: 50px !important; /* developer ke neeche */
      left: 0; right:0;
      height: 6px !important; /* chhota */
      z-index: 9998 !important;
    }
    .shaka-seek-bar-background { height: 6px !important; background: rgba(50,55,61,0.6) !important; }
    .shaka-seek-bar-buffered { height:6px !important; background: rgba(135,206,235,0.4) !important; }
    .shaka-seek-bar-played { height:6px !important; background: #1e90ff !important; }

    /* Hide default spinner */
    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg { display:none !important; }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
</head>
<body>

  <div class="glow-developer">Developer - DevCoderz X Assault Decoder</div>

  <div class="popup-overlay" id="telegramPopup">
    <h2>Join Our Telegram Group to Continue</h2>
    <button class="popup-button" onclick="joinTelegram()">Join Telegram</button>
    <button class="popup-skip" onclick="skipPopup()">Skip</button>
  </div>

  <div data-shaka-player-container class="shaka-mobile shaka-video-container" id="videoContainer" shaka-controls="true">
    <div class="shaka-video-container shaka-video" data-shaka-player="">
      <video muted autoplay playsinline preload="metadata"></video>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>

  <script>
    const streamUrl = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";

    function joinTelegram() {
      window.open("https://t.me/+vhBu7WHaWXFkZTRl", "_blank");
      startVideo();
    }
    function skipPopup() { startVideo(); }

    function startVideo() {
      document.getElementById('telegramPopup').style.display='none';
      const container = document.getElementById('videoContainer');
      container.style.display='block';
      initShaka();
    }

    async function initShaka() {
      shaka.polyfill.installAll();
      if(!shaka.Player.isBrowserSupported()){ console.error('Browser not supported'); return; }

      const video = document.querySelector('video');
      const player = new shaka.Player();
      await player.attach(video);

      const container = document.querySelector('.shaka-video-container');
      const ui = new shaka.ui.Overlay(player, container, video);

      // Only ONE progress bar will show
      ui.configure({
        controlPanelElements:['play_pause','mute','volume','time_and_duration','spacer','language','captions','picture_in_picture','quality','fullscreen'],
        volumeBarColors:{base:'rgba(135,206,235,0.35)', level:'rgb(255,255,255)'},
        seekBarColors:{base:'rgba(50,55,61,0.6)', buffered:'rgba(135,206,235,0.4)', played:'#1e90ff'}
      });

      player.addEventListener('error', e=>console.error('Shaka Error:', e.detail));

      try { 
        await player.load(streamUrl); 
        video.muted=true; 
        const playPromise=video.play(); 
        if(playPromise!==undefined) playPromise.catch(e=>console.log("Autoplay blocked:",e)); 
      }
      catch(e){ console.error('Load error:', e); }

      document.addEventListener('click', ()=>{
        if(video.muted){ video.muted=false; video.volume=1; }
      }, {once:true});
    }
  </script>
</body>
</html>
