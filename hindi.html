<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
/* Reset */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#000; width:100%; height:100%; font-family: system-ui, -apple-system, sans-serif; overflow:hidden; }

/* Glowing Developer Name - Single line, single color */
.glow-developer {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(16px, 2vw, 24px);
  font-weight: bold;
  color: #1e90ff; /* DeepSkyBlue */
  text-shadow: 0 0 5px #1e90ff,
               0 0 10px #1e90ff,
               0 0 20px #1e90ff,
               0 0 40px #00ffff;
  z-index: 9999;
  pointer-events: none;
  white-space: nowrap; /* Keeps the text in one line */
  text-align: center;
}

/* Video Container */
.shaka-video-container {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

video {
  width: 100%;
  height: 100%;
  background: #000;
  object-fit: contain;
}

/* Hide Shaka spinner */
.shaka-spinner-container,
.shaka-spinner,
.shaka-spinner-svg {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
}

/* Blue Controls & Icons */
.shaka-controls-button,
.shaka-overflow-button-label,
.shaka-current-time,
.shaka-time-container {
  color: dark-blue !important;
}

.shaka-controls-button svg path {
  fill: #1e90ff !important;
}

/* Responsive Logo */
.video-logo {
  position: absolute;
  top: 10px;
  left: 10px;
  opacity: 0.8;
  z-index: 1000;
  transition: opacity 0.3s ease;
  width: clamp(50px, 12vw, 65px);
  height: auto;
  aspect-ratio: 65/20;
}
.video-logo:hover { opacity: 1; }

</style>

<!-- Shaka Player CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

</head>
<body>

<!-- Developer Name -->
<div class="glow-developer">Developers - DevCoderz X Assault Decoder</div>

<!-- Video Container -->
<div data-shaka-player-container class="shaka-mobile shaka-video-container" shaka-controls="true" style="cursor: none;">
  <div class="shaka-video-container shaka-video" data-shaka-player="">
    <video autoplay muted playsinline preload="metadata" class="shaka-video"></video>
  </div>
  <canvas class="shaka-canvas-container"></canvas>
</div>

<!-- Shaka Player JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    console.error('Browser not supported');
    return;
  }

  const video = document.querySelector('video');
  const player = new shaka.Player();
  await player.attach(video);

  const container = document.querySelector('.shaka-video-container');
  const ui = new shaka.ui.Overlay(player, container, video);

  // Shaka UI colors
  ui.configure({
    controlPanelElements: ['play_pause','mute','volume','time_and_duration','spacer','language','captions','picture_in_picture','quality','fullscreen'],
    volumeBarColors: { base: 'rgba(135,206,235,0.35)', level:'rgb(255,255,255)' },
    seekBarColors: { base:'rgba(50,55,61)', buffered:'rgba(135,206,235,0.6)', played:'rgb(255,255,255)' }
  });

  const streamUrl = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";

  player.addEventListener('error', e => console.error('Shaka Player Error:', e.detail));

  try {
    await player.load(streamUrl);
    console.log("Stream loaded successfully");

    // Auto unmute after 1 sec
    setTimeout(()=>{ video.muted=false; video.volume=1; video.play(); }, 1000);
  } catch (error) {
    console.error('Load error:', error);
  }
});
</script>

</body>
</html>
