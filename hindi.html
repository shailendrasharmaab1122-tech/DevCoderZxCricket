<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; background:#000; font-family:system-ui, -apple-system, sans-serif; overflow:hidden; }

.glow-developer {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(16px, 2vw, 24px);
  font-weight: bold;
  color: #1e90ff;
  text-shadow: 0 0 5px #1e90ff, 0 0 10px #1e90ff, 0 0 20px #1e90ff, 0 0 40px #00ffff;
  z-index: 9999;
  pointer-events: none;
  white-space: nowrap;
  text-align: center;
}

.shaka-video-container {
  position: absolute;
  inset:0;
  width:100%;
  height:100%;
}

video {
  width:100%;
  height:100%;
  background:#000;
  object-fit:contain;
}

.shaka-spinner-container,
.shaka-spinner,
.shaka-spinner-svg {
  display: none !important;
  visibility: hidden !important;
  opacity: 0 !important;
}

.popup-overlay {
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.85);
  z-index:9998;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.popup-box {
  background:#111;
  padding:25px 30px;
  border-radius:10px;
  text-align:center;
  color:#fff;
  max-width:300px;
  width:90%;
  font-size:clamp(14px, 2vw, 18px);
}

.popup-box a {
  display:inline-block;
  margin:10px 5px;
  padding:10px 20px;
  background:#1e90ff;
  color:#fff;
  border-radius:5px;
  text-decoration:none;
  font-weight:bold;
}

.popup-box button {
  display:inline-block;
  margin:10px 5px;
  padding:10px 20px;
  background:#555;
  color:#fff;
  border-radius:5px;
  border:none;
  font-weight:bold;
  cursor:pointer;
}
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

</head>
<body>

<div class="glow-developer">Developer - DevCoderz X Assault Decoder</div>

<div data-shaka-player-container class="shaka-mobile shaka-video-container" shaka-controls="true">
  <div class="shaka-video-container shaka-video" data-shaka-player="">
    <video autoplay muted playsinline preload="metadata" class="shaka-video"></video>
  </div>
  <canvas class="shaka-canvas-container"></canvas>
</div>

<div class="popup-overlay" id="telegramPopup">
  <div class="popup-box">
    <p>Join our Telegram channel to continue watching!</p>
    <a href="http://t.me/cric_decoders" target="_blank">Join Telegram</a>
    <button id="skipBtn">Skip</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  shaka.polyfill.installAll();

  if (!shaka.Player.isBrowserSupported()) {
    console.error('Browser not supported');
    return;
  }

  const video = document.querySelector('video');
  const player = new shaka.Player();
  await player.attach(video);

  const container = document.querySelector('.shaka-video-container');
  const ui = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: ['play_pause','mute','volume','time_and_duration','spacer','language','captions','picture_in_picture','quality','fullscreen'],
    volumeBarColors: { base:'rgba(135,206,235,0.35)', level:'rgb(255,255,255)' },
    seekBarColors: { base:'rgba(50,55,61)', buffered:'rgba(135,206,235,0.6)', played:'rgb(255,255,255)' }
  });

  const streamUrl = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";

  try {
    await player.load(streamUrl);
    console.log("Stream loaded successfully");
  } catch (e) {
    console.error('Load error:', e);
  }

  const popup = document.getElementById('telegramPopup');
  const skipBtn = document.getElementById('skipBtn');

  function startVideo() {
    popup.style.display = 'none';
    video.muted = false;
    video.volume = 1;
    video.play();
  }

  skipBtn.addEventListener('click', startVideo);
  popup.addEventListener('click', e => { if(e.target === popup) startVideo(); });
});
</script>
</body>
</html>
