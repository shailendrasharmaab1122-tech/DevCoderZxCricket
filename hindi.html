<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DevCoderz X Assault Decoder">
<meta name="theme-color" content="#ffffff">
<title>DevCoderz X Assault Decoder // Live Stream</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --bg-deep: #f8fafc;
    --bg-gradient: linear-gradient(to bottom, #ffffff 0%, #f1f5f9 100%);
    --glass-bg: rgba(255, 255, 255, 0.75);
    --glass-border: rgba(0, 0, 0, 0.08);
    --glass-blur: blur(20px);
    --glass-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.08);
    --accent-primary: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.25);
    --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --danger: #ef4444;
    --danger-glow: rgba(239, 68, 68, 0.2);
    --success: #10b981;
}

* { box-sizing: border-box; margin:0; padding:0; font-family:'Outfit',sans-serif; }
body { background:var(--bg-gradient); color:var(--text-primary); min-height:100vh; display:flex; justify-content:center; padding:1.5rem; }
body::before {
    content:'';
    position:fixed;
    inset:-50% 0 0 0;
    background:radial-gradient(circle at center, rgba(59,130,246,0.05) 0%, transparent 60%);
    z-index:-1;
}

.container{ width:100%; max-width:1100px; animation:slideUpFade 0.8s ease forwards; }
@keyframes slideUpFade { from{opacity:0; transform:translateY(30px);} to{opacity:1; transform:translateY(0);} }

.stream-header{
    background:var(--glass-bg); backdrop-filter:var(--glass-blur);
    border:1px solid var(--glass-border); border-radius:16px; padding:1rem 2rem;
    display:flex; justify-content:space-between; align-items:center; box-shadow:var(--glass-shadow); margin-bottom:1.5rem;
}
.live-badge{ background:rgba(239,68,68,0.1); color:#dc2626; padding:0.4rem 1rem; border-radius:30px; font-weight:700; display:flex; align-items:center; gap:0.5rem;}

#player-container{ aspect-ratio:16/9; background:#000; border-radius:16px; overflow:hidden; box-shadow:0 25px 50px -12px rgba(0,0,0,0.25);}
iframe{ width:100%; height:100%; border:none;}

.grid-panels{ margin-top:2rem; display:grid; gap:1.5rem; grid-template-columns:repeat(auto-fit, minmax(300px,1fr)); }
.info-card{ background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:16px; padding:1.5rem; text-align:center; box-shadow:var(--glass-shadow); }
.action-button{ margin-top:1rem; width:100%; display:flex; justify-content:center; align-items:center; gap:0.75rem; padding:1rem; background:var(--accent-gradient); color:#fff; border-radius:12px; font-weight:600; text-decoration:none; border:none; cursor:pointer; transition: 0.3s ease; }

.popup{
  position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none;
  justify-content:center; align-items:center; z-index:99999; font-family:'Outfit',sans-serif;
}
.popup-box{ background:#fff; padding:22px; max-width:420px; width:90%; border-radius:16px; text-align:left;}
.popup-box h2{ text-align:center; margin-bottom:12px;}
.popup-box button{ margin-top:14px; width:100%; padding:10px; border:none; border-radius:10px; background:#3b82f6; color:#fff; font-size:16px; cursor:pointer;}
</style>
</head>
<body>

<main class="container">
    <div class="stream-header">
        <h1>DevCoderz X Assault Decoder</h1>
        <span class="live-badge"><i class="fa-solid fa-circle"></i> LIVE NOW</span>
    </div>

    <div id="player-container">
        <iframe src="https://devcoderzxcricket.vercel.app/ntmate.ka.baap.html" allow="encrypted-media; autoplay" allowfullscreen></iframe>
    </div>

    <div class="grid-panels">
        <div class="info-card">
            <h2>📣 Follow us for updates</h2>
            <a href="https://t.me/Cric_decoders" target="_blank" class="action-button">
                <i class="fa-brands fa-telegram"></i> Join Telegram
            </a>
        </div>
        <div class="info-card">
            <h2><i class="fa-solid fa-share-nodes"></i> Share Stream</h2>
            <button class="action-button" id="shareButton">
                <i class="fa-solid fa-copy"></i> Copy Stream Link
            </button>
        </div>
    </div>
</main>

<div id="telegramPopup" class="popup">
  <div class="popup-box">
    <h2>📣 Join Telegram</h2>
    <p>Stay updated with latest streams & news</p>
    <button onclick="joinTelegram()">Join Telegram ✅</button>
    <button onclick="closeTelegramPopup()">Close ❌</button>
  </div>
</div>

<script>
// --- Share Functionality ---
document.getElementById('shareButton').addEventListener('click', async () => {
    const btn = document.getElementById('shareButton');
    const originalContent = btn.innerHTML;
    const shareUrl = window.location.href;

    try {
        // Desktop par copy karega, Mobile par share menu khol sakta hai
        if (navigator.share) {
            await navigator.share({
                title: 'DevCoderz X Assault Decoder',
                url: shareUrl
            });
        } else {
            await navigator.clipboard.writeText(shareUrl);
            
            // UI Feedback (Button color changes to green)
            btn.innerHTML = '<i class="fa-solid fa-check"></i> Link Copied!';
            btn.style.background = '#10b981'; // Green color
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.style.background = ''; // Revert to CSS gradient
            }, 2000);
        }
    } catch (err) {
        // Fallback for older browsers
        const input = document.createElement('input');
        input.value = shareUrl;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        alert('Link Copied to Clipboard!');
    }
});

// --- Popup Logic ---
window.onload = function() {
    // 3 second baad popup show karega
    setTimeout(() => {
        document.getElementById("telegramPopup").style.display = "flex";
    }, 3000);
};

function joinTelegram(){
  window.open("https://t.me/Cric_decoders","_blank");
}

function closeTelegramPopup(){
  document.getElementById("telegramPopup").style.display="none";
}
</script>

</body>
</html>
