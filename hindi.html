<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DevCoderz X Assault Decoder</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0b0f1a;
            --accent: #2563eb;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { 
            background: var(--bg); 
            background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.1) 0px, transparent 50%);
            color: #fff; min-height: 100vh; padding: 15px; overflow-x: hidden;
        }
        .main-wrapper { max-width: 900px; margin: 0 auto; }
        .brand-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px; background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 20px; margin-bottom: 20px;
        }
        .brand-text { font-weight: 800; font-size: 1.2rem; }
        .brand-text span { color: var(--accent); }
        .player-shell {
            width: 100%; aspect-ratio: 16/9; background: #000; 
            border-radius: 24px; overflow: hidden; border: 1px solid var(--border);
        }
        iframe { width: 100%; height: 100%; border: none; }
        .app-controls { display: flex; gap: 10px; margin-top: 15px; }
        .control-btn {
            flex: 1; padding: 14px; border-radius: 15px; border: 1px solid var(--border);
            background: var(--glass); color: #fff; font-weight: 600; cursor: pointer;
        }
        .tg-btn {
            display: block; width: 100%; padding: 16px; background: var(--accent); 
            color: #fff; text-decoration: none; border-radius: 16px; 
            font-weight: 800; margin-top: 15px; text-align: center;
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="main-wrapper">
    <header class="brand-header">
        <div class="brand-text">DevCoderz <span>X</span> Assault Decoder</div>
        <div style="color: #ff4757; font-weight: 900;">LIVE</div>
    </header>

    <div class="player-shell" id="vidFrame">
        <iframe id="main-player" src="/prince.my.son.html" allowfullscreen></iframe>
    </div>

    <div class="app-controls">
        <button class="control-btn" onclick="toggleRotate()">Fullscreen</button>
        <button class="control-btn" onclick="location.reload()">Refresh</button>
    </div>

    <div style="margin-top: 20px;">
        <a href="https://t.me/Cric_decoders" target="_blank" class="tg-btn">JOIN TELEGRAM</a>
    </div>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
            .then(() => console.log("Success"))
            .catch(() => console.log("Error"));
        });
    }

    function toggleRotate() {
        const player = document.getElementById('vidFrame');
        if (!document.fullscreenElement) {
            player.requestFullscreen().catch(e => {});
        } else {
            document.exitFullscreen();
        }
    }
</script>
</body>
</html>
