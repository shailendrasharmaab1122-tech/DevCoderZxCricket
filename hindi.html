<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevCoderz X Assault Decoder // Live Stream</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
    margin: 0; padding: 2rem; font-family: 'Outfit', sans-serif;
    background: #f1f5f9; color: #1e293b; display: flex; flex-direction: column; align-items: center;
}
#player-container {
    width: 100%; max-width: 900px; aspect-ratio: 16/9;
    border-radius: 16px; overflow: hidden; background: #000;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
}
.action-button { margin-top: 1rem; padding: 1rem; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg,#3b82f6 0%,#2563eb 100%); color: #fff; }
.grid-panels { display: flex; gap: 1rem; margin-top: 1.5rem; }
</style>
</head>
<body>

<h1>DevCoderz X Assault Decoder</h1>
<div id="player-container"></div>

<div class="grid-panels">
    <button class="action-button" onclick="copyURL()">Copy Stream Link ❤️</button>
</div>

<script>
(function() {
    // URL to iframe page (iframe page will contain Shaka Player)
    var iframePageURL = "iframe_player.html";  // rename iframe page accordingly
    var iframe = document.createElement('iframe');
    iframe.src = iframePageURL;
    iframe.allow = "autoplay; encrypted-media";
    iframe.allowFullscreen = true;
    iframe.style.border = 'none';
    iframe.style.width = '100%';
    iframe.style.height = '100%';
    document.getElementById('player-container').appendChild(iframe);
})();

function copyURL() {
    navigator.clipboard.writeText(window.location.href);
    alert("Link Copied! ✅");
}
</script>

</body>
</html>
