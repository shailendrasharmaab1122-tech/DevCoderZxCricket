<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DevCoderz X Assault Decoder</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #0b0f1a;
            --accent: #2563eb;
            --glass: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { 
            background: var(--bg); 
            background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.1) 0px, transparent 50%);
            color: #fff; min-height: 100vh; padding: 15px; overflow-x: hidden;
        }
        .main-wrapper { max-width: 900px; margin: 0 auto; }
        .brand-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px; background: var(--glass); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 20px; margin-bottom: 20px;
        }
        .brand-text { font-weight: 800; font-size: 1.2rem; }
        .brand-text span { color: var(--accent); }
        .player-shell {
            width: 100%; aspect-ratio: 16/9; background: #000; 
            border-radius: 24px; overflow: hidden; border: 1px solid var(--border);
            position: relative;
        }
        iframe { width: 100%; height: 100%; border: none; }
        .app-controls { display: flex; gap: 10px; margin-top: 15px; }
        .control-btn {
            flex: 1; padding: 14px; border-radius: 15px; border: 1px solid var(--border);
            background: var(--glass); color: #fff; font-weight: 600; cursor: pointer;
            transition: 0.3s;
        }
        .control-btn:active { transform: scale(0.95); background: var(--border); }
        .tg-btn {
            display: block; width: 100%; padding: 16px; background: var(--accent); 
            color: #fff; text-decoration: none; border-radius: 16px; 
            font-weight: 800; margin-top: 15px; text-align: center;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }
    </style>
</head>
<body oncontextmenu="return false;" onkeydown="return false;">

<div class="main-wrapper">
    <header class="brand-header">
        <div class="brand-text">DevCoderz <span>X</span> Assault Decoder</div>
        <div style="color: #ff4757; font-weight: 900; animation: blink 1s infinite;">LIVE</div>
    </header>

    <div class="player-shell" id="vidFrame">
        <iframe id="main-player" src="about:blank" allowfullscreen></iframe>
    </div>

    <div class="app-controls">
        <button class="control-btn" onclick="toggleRotate()"><i class="fa-solid fa-expand"></i> Fullscreen</button>
        <button class="control-btn" onclick="location.reload()"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </div>

    <div style="margin-top: 20px;">
        <a href="https://t.me/Cric_decoders" target="_blank" class="tg-btn">JOIN TELEGRAM</a>
    </div>
</div>

<style>
    @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.3;} 100% {opacity: 1;} }
</style>

<script>
    // Security Layer: Obfuscated URL Injection
    (function() {
        const _v1 = "aHR0cHM6Ly9jcmlja2V0aC52ZXJjZWwuYXBwLw=="; // Base64 for Https://cricketh.vercel.app/
        
        document.addEventListener('DOMContentLoaded', function() {
            const _p = document.getElementById('main-player');
            // Decode and inject src after a tiny delay
            setTimeout(() => {
                _p.setAttribute('src', atob(_v1));
            }, 650);
        });

        // Block common inspection keys
        window.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'u' || e.key === 's' || e.key === 'i')) {
                e.preventDefault();
            }
        });
    })();

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
    }

    function toggleRotate() {
        const player = document.getElementById('vidFrame');
        if (!document.fullscreenElement) {
            player.requestFullscreen().catch(e => {
                alert("Fullscreen not supported or blocked");
            });
        } else {
            document.exitFullscreen();
        }
    }
</script>
</body>
</html>
