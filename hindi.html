<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<!-- Shaka Player Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.min.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

/* Hide Shaka Player UI completely */
.shaka-seek-bar-container,
.shaka-seek-bar,
.shaka-current-time,
.shaka-duration,
.shaka-ad-markers,
.shaka-volume-bar-container,
.shaka-mute-button,
.shaka-play-button,
.shaka-rewind-button,
.shaka-fastforward-button,
.shaka-fullscreen-button,
.shaka-settings-menu-button,
.shaka-caption-button,
.shaka-spinner-container,
.shaka-spinner,
.shaka-spinner-svg,
.shaka-controls-container {
    display: none !important;
}
</style>
</head>
<body>

<video id="video" autoplay playsinline muted></video> <!-- muted for autoplay to work on mobile -->

<script>
document.addEventListener('DOMContentLoaded', async () => {
    // Install Shaka polyfills
    shaka.polyfill.installAll();

    // Check browser support
    if (!shaka.Player.isBrowserSupported()) {
        alert("Browser not supported!");
        return;
    }

    const video = document.getElementById('video');
    const player = new shaka.Player(video);

    // Example DASH manifest (replace with your own)
    const manifestUri = 'https://storage.googleapis.com/shaka-demo-assets/angel-one/dash.mpd';

    // Error handling
    player.addEventListener('error', (event) => {
        console.error("Shaka Player Error:", event.detail);
    });

    try {
        await player.load(manifestUri);
        console.log("Video loaded successfully!");
        video.play(); // ensure autoplay
    } catch (e) {
        console.error("Error loading video:", e);
    }
});
</script>

</body>
</html>
