<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
/* Reset */
* { margin:0; padding:0; box-sizing:border-box; }
html, body { background:#000; width:100%; height:100%; font-family: system-ui, -apple-system, sans-serif; overflow:hidden; }

/* Glowing Developer Name */
.glow-developer {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  font-size: clamp(14px, 1.5vw, 18px);
  font-weight: bold;
  z-index: 9999;
  pointer-events: none;
  font-family: system-ui, -apple-system, sans-serif;
}

/* Developer label + name in one line with separate colors */
.glow-developer span.dev-label {
  color: #00BFFF; /* DeepSkyBlue */
  text-shadow: 0 0 4px #00BFFF, 0 0 8px #87CEFA;
}

.glow-developer span.dev-name {
  background: linear-gradient(90deg, #FF4500, #FFD700, #FF69B4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 5px #FF4500, 0 0 10px #FFD700, 0 0 15px #FF69B4, 0 0 20px #FF4500;
  margin-left:5px;
}

/* Video Container */
.shaka-video-container {
  position:absolute;
  inset:0;
  display:none; /* hidden until popup skipped */
  width:100%;
  height:100%;
}
video { width:100%; height:100%; object-fit:contain; background:#000; }

/* Hide Shaka Spinner */
.shaka-spinner-container,
.shaka-spinner,
.shaka-spinner-svg { display:none !important; visibility:hidden !important; opacity:0 !important; }

/* Telegram Popup */
.popup-overlay {
  position:absolute; inset:0; background:rgba(0,0,0,0.85); z-index:9998; display:flex;
  flex-direction:column; justify-content:center; align-items:center; color:#fff; text-align:center;
}
.popup-overlay h2 { margin-bottom:20px; font-size:20px; color:#1e90ff; }
.popup-button, .popup-skip {
  margin-top:15px; padding:10px 25px; font-size:16px; font-weight:bold; border:none; cursor:pointer; border-radius:6px; transition:.3s;
}
.popup-button { background:#1e90ff; color:#fff; }
.popup-button:hover { background:#00ffff; color:#000; }
.popup-skip { background:transparent; color:#fff; text-decoration:underline; margin-top:10px; }
</style>

<!-- Shaka Player CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
</head>
<body>

<!-- Developer Name -->
<div class="glow-developer">
  <span class="dev-label">Developer -</span>
  <span class="dev-name">DevCoderz X Assault Decoder</span>
</div>

<!-- Telegram Popup -->
<div class="popup-overlay" id="popup">
  <h2>Join our Telegram Channel to Continue</h2>
  <button class="popup-button" id="joinBtn">Join Telegram</button>
  <button class="popup-skip" id="skipBtn">Skip</button>
</div>

<!-- Video Container -->
<div data-shaka-player-container class="shaka-video-container" shaka-controls="true" style="cursor:none;">
  <div class="shaka-video-container shaka-video" data-shaka-player="">
    <video autoplay muted playsinline preload="metadata" poster="" src="blob:https://waptv.wapka.xyz/81ff5297-c515-4845-8099-68ded74f4bc2" class="shaka-video"></video>
  </div>
  <canvas class="shaka-canvas-container"></canvas>
</div>

<!-- Shaka Player Script -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  shaka.polyfill.installAll();
  if (!shaka.Player.isBrowserSupported()) { console.error('Browser not supported'); return; }

  const video = document.querySelector('video');
  const player = new shaka.Player();
  await player.attach(video);
  const container = document.querySelector('.shaka-video-container');
  const ui = new shaka.ui.Overlay(player, container, video);

  ui.configure({
    controlPanelElements: [
      'play_pause', 'mute', 'volume', 'time_and_duration',
      'spacer', 'language', 'captions', 'picture_in_picture',
      'quality', 'fullscreen'
    ],
    volumeBarColors: { base:'rgba(135,206,235,0.35)', level:'rgb(255,255,255)' },
    seekBarColors: { base:'rgba(50,55,61)', buffered:'rgba(135,206,235,0.6)', played:'rgb(255,255,255)' }
  });

  const drmConfig = { clearKeys: { "400131994b445d8c8817202248760fda":"2d56cb6f07a75b9aff165d534ae2bfc4" } };
  const streamUrl = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";

  player.configure({
    drm: drmConfig,
    streaming: { lowLatencyMode:true, bufferingGoal:15, rebufferingGoal:2, bufferBehind:15, segmentRequestTimeout:8000, segmentPrefetchLimit:2, useNativeHlsOnSafari:true },
    manifest: { retryParameters:{ timeout:8000, maxAttempts:3 } }
  });

  player.addEventListener('error', e => console.error('Shaka Player Error:', e.detail));

  try { await player.load(streamUrl); console.log("Stream loaded"); } 
  catch(e){ console.error('Load error:', e); }

  // Popup buttons
  const popup = document.getElementById('popup');
  const joinBtn = document.getElementById('joinBtn');
  const skipBtn = document.getElementById('skipBtn');

  function startVideo() {
    popup.style.display='none';
    container.style.display='block';
    video.muted = false;
    video.volume = 1;
    video.play().catch(()=>console.log("Autoplay blocked"));
  }

  joinBtn.addEventListener('click', () => {
    window.open('https://t.me/+vhBu7WHaWXFkZTRl', '_blank');
    startVideo();
  });

  skipBtn.addEventListener('click', startVideo);
});
</script>
</body>
</html>
