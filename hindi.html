<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Live Stream | DevCoderz</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #6366f1; /* Modern Indigo */
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        /* Header Style */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.5px; }
        .logo span { color: var(--primary); }

        .live-tag {
            background: #ef4444;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        /* Video Box */
        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none;
        }

        /* Controls */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
            text-decoration: none;
        }

        .btn-secondary { background: var(--card-bg); color: white; border: 1px solid rgba(255,255,255,0.1); }
        .btn-primary { background: var(--primary); color: white; margin-top: 15px; width: 100%; font-size: 1.1rem; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">DEV<span>CODERZ</span></div>
        <div class="live-tag">● LIVE</div>
    </div>

    <div class="video-container">
        <iframe id="player" src="https://devcoderzxcricket.vercel.app/prince.my.son.html" allowfullscreen></iframe>
    </div>

    <div class="actions">
        <button class="btn btn-secondary" onclick="document.getElementById('player').requestFullscreen()">
            <i class="fa-solid fa-expand"></i> Fullscreen
        </button>
        <button class="btn btn-secondary" onclick="location.reload()">
            <i class="fa-solid fa-rotate"></i> Refresh
        </button>
    </div>

    <a href="https://t.me/Cric_decoders" target="_blank" class="btn btn-primary">
        <i class="fa-brands fa-telegram"></i> Join Telegram Channel
    </a>
</div>

<script>
    // Security: Right Click Disable (Optional)
    document.addEventListener('contextmenu', event => event.preventDefault());
</script>

</body>
</html>
