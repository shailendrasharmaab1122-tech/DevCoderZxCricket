<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <!-- Glowing Developer Name CSS -->
  <style>
    .glow-developer {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(16px, 2vw, 24px);
      font-weight: bold;
      color: #1e90ff;
      text-shadow: 0 0 5px #1e90ff,
                   0 0 10px #1e90ff,
                   0 0 20px #1e90ff,
                   0 0 40px #00ffff;
      z-index: 9999;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    /* Telegram Overlay */
    .telegram-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      color: #fff;
      text-align: center;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .telegram-overlay h1 {
      font-size: clamp(24px, 4vw, 48px);
      margin-bottom: 20px;
      color: #1e90ff;
      text-shadow: 0 0 10px #1e90ff, 0 0 20px #00ffff;
    }

    .telegram-overlay a.join-btn,
    .telegram-overlay button.skip-btn {
      background: #1e90ff;
      color: #fff;
      padding: 15px 30px;
      font-size: clamp(16px, 2vw, 22px);
      border-radius: 10px;
      text-decoration: none;
      box-shadow: 0 0 10px #1e90ff, 0 0 20px #00ffff;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
      cursor: pointer;
    }

    .telegram-overlay a.join-btn:hover,
    .telegram-overlay button.skip-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #1e90ff, 0 0 30px #00ffff;
    }
  </style>

  <!-- Shaka Player CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
</head>
<body>

  <!-- Glowing Developer Name -->
  <div class="glow-developer">Developer - DevCoderz X Assault Decoder</div>

  <!-- Telegram Join Overlay -->
  <div class="telegram-overlay" id="telegramOverlay">
    <h1>Join Our Telegram Channel!</h1>
    <a href="https://t.me/+vhBu7WHaWXFkZTRl" target="_blank" class="join-btn" id="joinBtn">Join Now</a>
    <button class="skip-btn" id="skipBtn">Skip in <span id="countdown">5</span> sec</button>
  </div>

  <!-- Video Container -->
  <div data-shaka-player-container class="shaka-mobile shaka-video-container" shaka-controls="true" style="cursor: none;">
    <div class="shaka-video-container shaka-video" data-shaka-player="">
      <video muted autoplay playsinline preload="metadata" poster="" class="shaka-video"></video>
    </div>
    <canvas class="shaka-canvas-container"></canvas>
  </div>

  <!-- Shaka Player Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const video = document.querySelector('video');
      const overlay = document.getElementById('telegramOverlay');
      const joinBtn = document.getElementById('joinBtn');
      const skipBtn = document.getElementById('skipBtn');
      const countdownSpan = document.getElementById('countdown');

      // Countdown timer
      let countdown = 5;
      const timer = setInterval(() => {
        countdown--;
        countdownSpan.textContent = countdown;
        if (countdown <= 0) {
          clearInterval(timer);
          playVideo();
        }
      }, 1000);

      // Function to start video
      function playVideo() {
        overlay.style.display = 'none';
        video.muted = true;
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.then(() => {
            video.muted = false;
            video.volume = 1;
          }).catch(err => console.log("Autoplay blocked:", err));
        }
      }

      // Shaka Player setup
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) { console.error('Browser not supported'); return; }
      const player = new shaka.Player();
      await player.attach(video);

      const container = document.querySelector('.shaka-video-container');
      const ui = new shaka.ui.Overlay(player, container, video);
      ui.configure({
        controlPanelElements: [
          'play_pause', 'mute', 'volume', 'time_and_duration',
          'spacer', 'language', 'captions', 'picture_in_picture',
          'quality', 'fullscreen'
        ],
        volumeBarColors: { base: 'rgba(135, 206, 235, 0.35)', level: 'rgb(255,255,255)' },
        seekBarColors: { base: 'rgba(50, 55, 61)', buffered: 'rgba(135, 206, 235, 0.6)', played: 'rgb(255, 255, 255)' }
      });

      // Configure DRM/stream
      const drmConfig = { clearKeys: { "400131994b445d8c8817202248760fda":"2d56cb6f07a75b9aff165d534ae2bfc4" } };
      const streamUrl = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
      player.configure({ drm: drmConfig, streaming: { lowLatencyMode: true, bufferingGoal: 15, rebufferingGoal: 2, bufferBehind: 15 }, manifest: { retryParameters: { timeout: 8000, maxAttempts: 3 } } });

      player.addEventListener('error', (event) => console.error('Shaka Player Error:', event.detail));

      // Button events
      joinBtn.addEventListener('click', playVideo);
      skipBtn.addEventListener('click', () => { clearInterval(timer); playVideo(); });
    });
  </script>
</body>
</html>
