<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderZ | Star Sports Select 2 HD</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        #player-container { width: 100%; height: 100%; background: #000; }
        video { width: 100%; height: 100%; }
        /* Custom Green Glow for DevCoderZ */
        .shaka-video-container { border: 1px solid #00ff00; }
    </style>
</head>
<body>

    <div id="player-container" data-shaka-player-container shaka-controls="true">
        <video id="video" autoplay playsinline poster="https://img.media.jio.com/tvpimages/98/79/302114_1749665414817_l_medium.jpg"></video>
    </div>

    <script>
        const CONFIG = {
            mpdUrl: "https://jiotvpllive.cdn.jio.com/bpk-tv//Star_Sports_Select_HD_2_BTS/output/index.mpd",
            keyId: "6017d0514d425fa38f6e80ba6dcc852f", // Teri Key ID
            key: "0018944b00adf2078f62386f30c68b74"     // Teri Asli Key
        };

        async function initDevPlayer() {
            shaka.polyfill.installAll();
            
            const video = document.getElementById('video');
            const container = document.getElementById('player-container');
            const player = new shaka.Player(video);
            
            // UI Controls
            const ui = new shaka.ui.Overlay(player, container, video);

            // --- DRM CONFIG (VVIP Step) ---
            player.configure({
                drm: {
                    clearKeys: {
                        [CONFIG.keyId]: CONFIG.key
                    }
                },
                streaming: {
                    lowLatencyMode: true,
                    bufferingGoal: 10
                }
            });

            // --- HEADER BYPASS (Taaki Jio Block Na Kare) ---
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['Referer'] = 'https://www.jiotv.com/';
                request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
            });

            try {
                await player.load(CONFIG.mpdUrl);
                console.log("Success! Stream Started.");
            } catch (error) {
                console.error("Error Code:", error.code);
                // Agar 1001/4003 error aaye, toh samajh lena Proxy ki zarurat hai
            }
        }

        document.addEventListener('shaka-ui-loaded', initDevPlayer);
    </script>
</body>
</html>
