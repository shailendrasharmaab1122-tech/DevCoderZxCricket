<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevCoderZ Clean Streamer</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #000; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        video { width: 80%; border: 2px solid #00ff00; border-radius: 8px; box-shadow: 0 0 20px #00ff00; }
    </style>
</head>
<body>

    <video id="video" controls></video>

    <script>
        const video = document.getElementById('video');
        // Yahan apni .m3u8 stream ka asli link daalein
        const videoSrc = 'https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8';

        if (Hls.isSupported()) {
            const hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } 
        // For Safari/iOS (jahan HLS native support hai)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    </script>
</body>
</html>
