<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DevCoderZ | IPL LIVE FIX</title>
    <style>
        :root { --bg: #05080f; --accent: #2563eb; }
        body { background: var(--bg); color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        .player-shell { width: 95%; max-width: 850px; aspect-ratio: 16/9; background: #000; margin-top: 20px; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        iframe, video { width: 100%; height: 100%; border: none; }
        .status-tag { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; font-size: 10px; color: var(--accent); z-index: 10; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <div class="player-shell" id="mainContainer">
        <div class="status-tag" id="status">CONNECTING...</div>
        <iframe 
            id="backupPlayer"
            src="https://allrounder-live.pages.dev/star/star-1-hindi" 
            allowfullscreen="true" 
            allow="autoplay; encrypted-media; fullscreen">
        </iframe>
    </div>

    <div style="margin-top: 20px; text-align: center;">
        <p style="font-size: 12px; color: #aaa;">Agar video na chale toh page refresh karein.</p>
        <button onclick="location.reload()" style="padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 5px; cursor: pointer;">REFRESH STREAM</button>
    </div>

</body>
</html>
