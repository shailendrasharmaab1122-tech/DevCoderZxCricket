<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Devansh Sharma Player</title>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.ui.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/controls.css">
    <style>
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; }
        #container { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; }
        .dev-watermark {
            position: fixed; top: 15px; left: 15px; z-index: 10;
            background: rgba(0,240,255,0.2); border: 1px solid #00f0ff;
            padding: 5px 15px; border-radius: 50px; color: #fff;
            font-family: sans-serif; font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="dev-watermark">Developer: <b>Devansh Sharma</b></div>
    <div id="container" shaka-controls="true">
        <video id="video" autoplay playsinline></video>
    </div>

<script>
async function playLive() {
    const video = document.getElementById('video');
    const container = document.getElementById('container');
    const player = new shaka.Player(video);
    const ui = new shaka.ui.Overlay(player, container, video);

    // Ye proxy link stream ko bypass karne ke liye hai
    const proxyUrl = "https://allrounder-live.pages.dev/player/#";
    const manifest = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
    const kid = "400131994b445d8c8817202248760fda";
    const key = "2d56cb6f07a75b9aff165d534ae2bfc4";

    // Configuration for ClearKey
    player.configure({
        drm: {
            clearKeys: { [kid]: key }
        }
    });

    // Special Networking Filter for JIO
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
    });

    try {
        // Hum direct load karne ki jagah stream ko ek specific format mein load kar rahe hain
        await player.load(manifest);
        console.log("Working!");
    } catch (e) {
        // Agar direct na chale, toh samjho browser block kar raha hai
        console.error("CORS Blocked or Key Expired");
    }
}

document.addEventListener('shaka-ui-loaded', playLive);
document.addEventListener('DOMContentLoaded', playLive);
</script>
</body>
</html>
