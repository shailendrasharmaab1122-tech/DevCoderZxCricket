<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JioTV Player Fix</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
  <style>
    body { margin: 0; background: #000; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .video-container { width: 100%; height: 100%; }
    video { width: 100%; height: 100%; }
    #status { position: absolute; color: white; z-index: 10; font-family: sans-serif; background: rgba(0,0,0,0.5); padding: 10px; }
  </style>
</head>
<body>

  <div id="status">Initializing Player...</div>
  <div class="video-container" data-shaka-player-container>
    <video id="video" autoplay playsinline data-shaka-player></video>
  </div>

  <script>
    async function initApp() {
      const video = document.getElementById('video');
      const status = document.getElementById('status');
      const player = new shaka.Player(video);

      // 1. Proxy Setup (CORS bypass ke liye)
      const proxy = 'https://cors-anywhere.herokuapp.com/';
      const manifestUri = 'https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd';
      const token = '__hdnea__=st=1771464029~exp=1771550429~acl=/*~hmac=ed4c72d3d0ce76491c2ed440e71eada349e8b803057316b4711b7ee1da4d0374';

      // 2. Request Filter (Headers fix karne ke liye)
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // Proxy URL add karna
        request.uris[0] = proxy + request.uris[0];

        // JioTV specific headers
        // Browser 'Cookie' header block karta hai, isliye hum use proxy ke through bhejte hain (agar proxy support kare)
        request.headers['x-requested-with'] = 'XMLHttpRequest';
        request.headers['User-Agent'] = 'JioTV/7.0.8 (Linux; Android 9)';
      });

      try {
        // 3. Load Manifest with Token in URL
        // Cookie header block hone ki wajah se token ko URL mein pass karna zyada safe hai
        const finalUrl = manifestUri + '?' + token;
        
        await player.load(finalUrl);
        status.innerText = "Playing: Star Sports HD1 Hindi";
        setTimeout(() => status.style.display = 'none', 3000);
        
      } catch (e) {
        status.style.color = 'red';
        status.innerText = "Error: " + e.code + " - " + e.message;
        console.error('Error Code:', e.code, e);
      }
    }

    document.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
