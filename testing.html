<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JioTV Fix Player</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
  <style>
    body { margin: 0; background: #000; color: white; font-family: sans-serif; }
    #video { width: 100vw; height: 100vh; }
    #msg { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; z-index: 10; }
  </style>
</head>
<body>

  <div id="msg">Status: Wait...</div>
  <video id="video" controls autoplay></video>

  <script>
    async function startPlayer() {
      const video = document.getElementById('video');
      const msg = document.getElementById('msg');
      const player = new shaka.Player(video);

      // Sabse powerful proxy jo headers ko bypass karti hai
      const proxy = "https://api.allorigins.win/raw?url=";
      const streamUrl = "https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
      const token = "__hdnea__=st=1771464029~exp=1771550429~acl=/*~hmac=ed4c72d3d0ce76491c2ed440e71eada349e8b803057316b4711b7ee1da4d0374";

      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // Sirf manifest aur segments ke liye proxy lagana
        if (type == shaka.net.NetworkingEngine.RequestType.MANIFEST || type == shaka.net.NetworkingEngine.RequestType.SEGMENT) {
           let originalUrl = request.uris[0];
           // URL mein token jodna
           let separator = originalUrl.includes('?') ? '&' : '?';
           request.uris[0] = proxy + encodeURIComponent(originalUrl + separator + token);
        }
      });

      try {
        await player.load(streamUrl);
        msg.innerHTML = "Playing!";
      } catch (e) {
        msg.innerHTML = "Error: " + e.code + " (Check Console)";
        console.error("Full Error Details:", e);
      }
    }

    document.addEventListener('DOMContentLoaded', startPlayer);
  </script>
</body>
</html>
