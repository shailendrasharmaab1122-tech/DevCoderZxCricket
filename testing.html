<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JioTV Star Sports Fix</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>
  <style>
    body { margin: 0; background: #000; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; color: white; font-family: sans-serif; }
    #video-container { width: 100%; max-width: 960px; aspect-ratio: 16/9; position: relative; }
    video { width: 100%; height: 100%; background: #111; }
    #status { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.7); padding: 8px 15px; border-radius: 5px; font-size: 14px; z-index: 10; }
  </style>
</head>
<body>

  <div id="video-container">
    <div id="status">Status: Connecting...</div>
    <video id="video" controls autoplay playsinline></video>
  </div>

  <script>
    async function initJioPlayer() {
      const video = document.getElementById('video');
      const status = document.getElementById('status');
      const player = new shaka.Player(video);

      // Aapka Resource Data
      const baseUrl = "https://jiotvmblive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
      const token = "st=1771464029~exp=1771550429~acl=/*~hmac=ed4c72d3d0ce76491c2ed440e71eada349e8b803057316b4711b7ee1da4d0374";
      const fullCookie = "__hdnea__=" + token;
      
      // Best Proxy (Jo headers ko forward karti hai)
      const proxy = "https://api.allorigins.win/raw?url=";

      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // 1. Har request (Manifest & Segments) mein token jodna
        let originalUrl = request.uris[0];
        let separator = originalUrl.includes('?') ? '&' : '?';
        let urlWithToken = originalUrl + separator + "__hdnea__=" + token;

        // 2. Proxy ke sath URL ko wrap karna
        request.uris[0] = proxy + encodeURIComponent(urlWithToken);

        // 3. User-Agent aur Cookie Headers set karna
        request.headers['User-Agent'] = 'JioTV/7.0.8 (Linux; Android 9)';
        // Note: Browser shayad 'Cookie' header block kare, lekin proxy ke URL mein token pehle hi hai
        request.headers['Cookie'] = fullCookie;
      });

      // Player Settings for Stability
      player.configure({
        streaming: {
          bufferingGoal: 20,
          retryParameters: { maxAttempts: 5 }
        }
      });

      try {
        await player.load(baseUrl + "?__hdnea__=" + token);
        status.innerText = "Playing: Star Sports HD1 Hindi";
        status.style.color = "#4CAF50";
        console.log("Stream Loaded Successfully!");
      } catch (e) {
        status.innerText = "Error: " + e.code + " (Token Expired?)";
        status.style.color = "#FF5252";
        console.error("Error Detail:", e);
      }
    }

    document.addEventListener('DOMContentLoaded', initJioPlayer);
  </script>
</body>
</html>
