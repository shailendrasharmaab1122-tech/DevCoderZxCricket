<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Devansh Sharma - Live Stream</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.4/dist/controls.css">
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.4/dist/shaka-player.ui.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #070b1a;
            --primary-blue: #00f0ff;
            --card-bg: #0f172a;
            --text-light: #e2e8f0;
            --border-color: #1e293b;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container { width: 100%; max-width: 850px; padding: 15px; }

        .stream-header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .live-badge {
            background: #ff0000;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 1.5s infinite;
        }

        #player-container {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
            position: relative;
        }

        video { width: 100%; height: 100%; }

        .dev-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--primary-blue);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            color: white;
        }

        .action-button {
            display: flex; align-items: center; justify-content: center;
            gap: 10px; width: 100%; padding: 12px;
            background: linear-gradient(90deg, #4f46e5, #9333ea);
            color: white; border-radius: 8px; text-decoration: none; font-weight: 600;
            margin-top: 15px; border: none; cursor: pointer;
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<main class="container">
    <div class="stream-header">
        <h1>Star Sports 1 HD</h1>
        <div class="live-badge">LIVE</div>
    </div>

    <div id="player-container">
        <div class="dev-tag">Developer: <b>Devansh Sharma</b></div>
        <video id="video" autoplay playsinline crossorigin="anonymous"></video>
    </div>

    <button class="action-button" onclick="window.open('https://t.me/your_telegram_link', '_blank')">
        <i class="fa-brands fa-telegram"></i> Join Telegram For Updates
    </button>
</main>

<script>
async function initPlayer() {
    const video = document.getElementById('video');
    const container = document.getElementById('player-container');
    const player = new shaka.Player(video);
    const ui = new shaka.ui.Overlay(player, container, video);

    // Aapka Diya Gaya Source aur Keys
    const manifestUri = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
    const config = {
        clearKeys: {
            "400131994b445d8c8817202248760fda": "2d56cb6f07a75b9aff165d534ae2bfc4"
        }
    };

    player.configure({
        drm: { clearKeys: config.clearKeys },
        streaming: { jumpLargeGaps: true }
    });

    // JioTV Headers Bypass
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
        request.headers['Referer'] = 'https://www.jiotv.com/';
    });

    try {
        await player.load(manifestUri);
    } catch (e) {
        console.error("Error loading stream", e);
    }
}

document.addEventListener('DOMContentLoaded', initPlayer);
</script>

</body>
</html>
