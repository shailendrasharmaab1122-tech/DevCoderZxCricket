<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Star Sports 1 HD | Devansh Sharma</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body, html { background: #000; color: #fff; height: 100vh; width: 100vw; overflow: hidden; }
        #wrapper { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; background: #000; }
        
        video { width: 100%; height: 100%; display: none; background: #000; }

        #play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
        }
        .play-btn {
            width: 85px;
            height: 85px;
            background: #00f0ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
            margin-bottom: 20px;
        }
        .play-btn svg { fill: #000; width: 40px; height: 40px; margin-left: 5px; }
        #play-overlay p { font-weight: 800; font-size: 20px; letter-spacing: 2px; color: #00f0ff; text-transform: uppercase; }

        .inner-dev-tag {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 2147483647;
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 15px;
            border-radius: 50px;
            border: 1px solid #00f0ff;
            display: none;
            align-items: center;
            pointer-events: none;
            backdrop-filter: blur(15px);
        }
        .dot { height: 8px; width: 8px; background: #00f0ff; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 10px #00f0ff; animation: blink 1.2s infinite; }
        .inner-dev-tag div { font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; }
        .inner-dev-tag span { color: #00f0ff; font-weight: 800; margin-left: 4px; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="wrapper">
        <div id="play-overlay">
            <div class="play-btn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
            </div>
            <p>Tap To Play</p>
        </div>

        <video id="video" controls autoplay playsinline></video>
        
        <div class="inner-dev-tag" id="myTag">
            <div class="dot"></div>
            <div>Developer <span>Devansh Sharma</span></div>
        </div>
    </div>

<script>
    async function initPlayer() {
        const video = document.getElementById('video');
        const overlay = document.getElementById('play-overlay');
        const tag = document.getElementById('myTag');

        // Shaka Player Setup
        shaka.polyfill.installAll();
        const player = new shaka.Player(video);

        // CONFIG - Aapke diye gaye Keys aur URL
        const manifestUri = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
        const keyId = "400131994b445d8c8817202248760fda";
        const key = "2d56cb6f07a75b9aff165d534ae2bfc4";

        player.configure({
            drm: {
                clearKeys: {
                    [keyId]: key
                }
            },
            streaming: {
                jumpLargeGaps: true
            }
        });

        // JioTV Bypass Headers
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
            request.headers['Referer'] = 'https://www.jiotv.com/';
            request.headers['Origin'] = 'https://www.jiotv.com';
        });

        overlay.addEventListener('click', async () => {
            overlay.style.display = 'none';
            video.style.display = 'block';
            tag.style.display = 'flex';

            try {
                await player.load(manifestUri);
                video.play();
            } catch (e) {
                console.error("Load Error", e);
                alert("Error: Link ya Keys expire ho chuki hain.");
            }
        });

        // Fullscreen Tag Management
        function handleFS() {
            if (document.fullscreenElement) {
                document.fullscreenElement.appendChild(tag);
            } else {
                document.getElementById('wrapper').appendChild(tag);
            }
        }
        document.addEventListener('fullscreenchange', handleFS);
    }

    document.addEventListener('DOMContentLoaded', initPlayer);
</script>
</body>
</html>
