<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player - DevCoderz</title>

  <style>
    .glow-developer {
      position: absolute; 
      top: 20px; 
      left: 50%; 
      transform: translateX(-50%);
      font-size: clamp(16px, 2.5vw, 24px); 
      font-weight: bold; 
      color: #1e90ff;
      text-shadow: 0 0 10px #1e90ff, 0 0 20px #00ffff; 
      z-index: 9999;
      pointer-events: none; 
      font-family: sans-serif;
      /* Ek line mein rakhne ke liye */
      white-space: nowrap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; }

    #player-container { position: absolute; inset: 0; width: 100%; height: 100%; }
    video { width: 100%; height: 100%; object-fit: contain; }

    /* Loading Spinner Hide */
    .shaka-spinner-container {
      display: none !important;
    }

    /* Progress Bar thoda upar karne ke liye */
    .shaka-controls-container {
      bottom: 30px !important; /* Screen se thoda upar */
    }

    .shaka-bottom-controls button { color: #1e90ff !important; }
    .shaka-range-element { color: #1e90ff !important; }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
</head>
<body>

  <div class="glow-developer">Developer - DevCoderZ</div>

  <div id="player-container" data-shaka-player-container shaka-controls="true">
    <video autoplay muted playsinline id="video" class="shaka-video"></video>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>

  <script>
    async function initApp() {
      shaka.polyfill.installAll();
      if (!shaka.Player.isBrowserSupported()) return;

      const video = document.getElementById('video');
      const container = document.getElementById('player-container');
      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);

      player.configure({
        drm: {
          clearKeys: {
            '2904b17cb64c996dbc254981b7602863': '66a7ef671b84498e64f94e8401fe8cb9'
          }
        },
        streaming: {
          rebufferingGoal: 2,
          bufferingGoal: 10,
          jumpLargeGaps: true
        }
      });

      const manifestUri = "https://otte.live.fly.ww.aiv-cdn.net/syd-nitro/live/dash/enc/qkp4pavybn/out/v1/2298afadf64943adb0b44dc540ace1ce/cenc.mpd";

      try {
        await player.load(manifestUri);
        console.log("Loaded!");
      } catch (e) {
        console.error("Error Code:", e.code);
      }
    }

    document.addEventListener('shaka-ui-loaded', initApp);

    window.addEventListener('click', () => {
        document.getElementById('video').muted = false;
    }, { once: true });
  </script>
</body>
</html>
