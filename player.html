<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <!-- Glowing Developer Name CSS -->
  <style>
    .glow-developer {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(16px, 2vw, 24px);
      font-weight: bold;
      color: #1e90ff;
      text-shadow: 0 0 5px #1e90ff,
                   0 0 10px #1e90ff,
                   0 0 20px #1e90ff,
                   0 0 40px #00ffff;
      z-index: 9999;
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    /* Blue Controls & Icons */
    .shaka-controls-button,
    .shaka-overflow-button-label,
    .shaka-current-time,
    .shaka-time-container {
      color: dark-blue !important;
    }

    .shaka-controls-button svg path {
      fill: #1e90ff !important;
    }

    /* Logo overlay - Responsive */
    .video-logo {
      position: absolute;
      top: 10px;
      left: 10px;
      opacity: 0.8;
      z-index: 1000;
      transition: opacity 0.3s ease;
      width: clamp(50px, 12vw, 65px);
      height: auto;
      aspect-ratio: 65/20;
    }

    @media (min-width: 768px) {
      .video-logo {
        width: clamp(65px, 8vw, 80px);
        top: 15px;
        left: 15px;
      }
    }

    @media (min-width: 1200px) {
      .video-logo {
        width: clamp(80px, 6vw, 100px);
        top: 20px;
        left: 20px;
      }
    }

    @media (max-width: 480px) {
      .video-logo {
        width: clamp(40px, 10vw, 50px);
        top: 8px;
        left: 8px;
      }
    }

    @media (max-width: 320px) {
      .video-logo {
        width: clamp(30px, 8vw, 40px);
        top: 5px;
        left: 5px;
      }
    }

    .video-logo:hover {
      opacity: 1;
    }
  </style>

  <!-- Shaka Player CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
</head>
<body>

  <!-- Glowing Developer Name -->
  <div class="glow-developer">Developer - DevCoderz</div>

  <!-- Video Container -->
  <div data-shaka-player-container class="shaka-mobile shaka-video-container" shaka-controls="true" style="cursor: none;">
    <div class="shaka-video-container shaka-video" data-shaka-player="">
      <video autoplay muted playsinline preload="metadata" poster="" src="blob:https://waptv.wapka.xyz/81ff5297-c515-4845-8099-68ded74f4bc2" class="shaka-video"></video>
    </div>
    <canvas class="shaka-canvas-container"></canvas>
    <!-- Shaka controls generated automatically -->
  </div>

  <!-- Shaka Player Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        console.error('Browser not supported');
        return;
      }

      const video = document.querySelector('video');
      const player = new shaka.Player();
      await player.attach(video);

      const container = document.querySelector('.shaka-video-container');
      const ui = new shaka.ui.Overlay(player, container, video);

      // Blue / Sky Controls
      ui.configure({
        controlPanelElements: [
          'play_pause', 'mute', 'volume', 'time_and_duration',
          'spacer', 'language', 'captions', 'picture_in_picture',
          'quality', 'fullscreen'
        ],
        volumeBarColors: { base: 'rgba(135, 206, 235, 0.35)', level: 'rgb(255,255,255)' },
        seekBarColors: { base: 'rgba(50, 55, 61)', buffered: 'rgba(135, 206, 235, 0.6)', played: 'rgb(255, 255, 255)' }
      });

      // DRM Config
      const drmConfig = {
        clearKeys: { "400131994b445d8c8817202248760fda":"2d56cb6f07a75b9aff165d534ae2bfc4" }
      };

      const streamUrl = "https://otte.live.fly.ww.aiv-cdn.net/syd-nitro/live/dash/enc/qkp4pavybn/out/v1/2298afadf64943adb0b44dc540ace1ce/cenc.mpd?|drmScheme=clearkey&drmLicense=2904b17cb64c996dbc254981b7602863:66a7ef671b84498e64f94e8401fe8cb9";

      player.configure({
        drm: drmConfig,
        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 15,
          rebufferingGoal: 2,
          bufferBehind: 15,
          retryParameters: { timeout: 10000, maxAttempts: 5, baseDelay: 300, backoffFactor: 1.2 },
          segmentRequestTimeout: 8000,
          segmentPrefetchLimit: 2,
          useNativeHlsOnSafari: true
        },
        manifest: { retryParameters: { timeout: 8000, maxAttempts: 3 } }
      });

      player.addEventListener('error', (event) => {
        console.error('Shaka Player Error:', event.detail);
      });

      try {
        await player.load(streamUrl);
        console.log("Stream loaded successfully");
        video.muted = true;
        const playPromise = video.play();
        if (playPromise !== undefined) playPromise.catch(err => console.log("Autoplay blocked:", err));
      } catch (error) {
        console.error('Load error:', error);
      }

      document.addEventListener('click', () => {
        if (video.muted) { video.muted = false; video.volume = 1; }
      }, { once: true });
    });
  </script>
</body>
</html>
