<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Sports 2 HD Fix</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/controls.css">
    <style>
        body { margin: 0; background: #000; }
        .video-container { width: 100%; height: 100vh; }
    </style>
</head>
<body>

<div class="video-container" data-shaka-player-container>
    <video data-shaka-player id="video" autoplay crossorigin="anonymous"></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.ui.js"></script>

<script>
const manifestUri = 'https://jiotvmblive.cdn.jio.com//bpk-tv/StarSportsHD2Hin_BTS/output/index.mpd?__hdnea__=st=1774648839~exp=1774735239~acl=/*~hmac=9c4b413ec2dc4f7dc1703988d9abc4902473253183e8b1140920ddfa29';

// YAHAN APNI KEYS DAALEIN (JSON API SE NIKAL KAR)
const KEY_ID = 'YOUR_KEY_ID_HERE'; 
const KEY_VALUE = 'YOUR_KEY_HERE';

async function initPlayer() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();

    // 1. DRM Configuration
    player.configure({
        drm: {
            clearKeys: {
                [KEY_ID]: KEY_VALUE
            }
        },
        manifest: {
            dash: {
                ignoreMinBufferTime: true
            }
        }
    });

    // 2. Networking Filter (Sabse Zaroori Step)
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // Jio servers aksar in headers ke bina 403 error dete hain
        request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36';
        
        // Agar browser allow kare toh ye headers bhi add karein
        // request.headers['Origin'] = 'https://www.jiotv.com';
        // request.headers['Referer'] = 'https://www.jiotv.com/';
    });

    try {
        await player.load(manifestUri);
        console.log('Player loaded!');
    } catch (e) {
        console.error('Error Code:', e.code, 'Message:', e.message);
        alert('Error: ' + e.code + '. Inspect element check karo!');
    }
}

document.addEventListener('shaka-ui-loaded', initPlayer);
</script>
</body>
</html>
