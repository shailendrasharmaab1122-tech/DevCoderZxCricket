<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player - DevCoderz</title>

  <style>
    .glow-developer {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(16px, 2vw, 24px);
      font-weight: bold;
      color: #1e90ff;
      text-shadow: 0 0 10px #1e90ff, 0 0 20px #1e90ff, 0 0 40px #00ffff;
      z-index: 9999;
      pointer-events: none;
      font-family: sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    /* Blue Theme Player Controls */
    .shaka-range-element { color: #1e90ff !important; }
    .shaka-bottom-controls button { color: #1e90ff !important; }
    .shaka-current-time { color: #1e90ff !important; }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
</head>
<body>

  <div class="glow-developer">Developer - DevCoderz</div>

  <div id="player-container" data-shaka-player-container class="shaka-video-container" shaka-controls="true">
    <video autoplay muted playsinline id="video" class="shaka-video"></video>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>

  <script>
    async function initApp() {
      // 1. Polyfills install karein
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        alert('Browser support nahi kar raha!');
        return;
      }

      const video = document.getElementById('video');
      const container = document.getElementById('player-container');
      
      // 2. Player aur UI initialize karein
      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);
      
      // UI Control configuration
      ui.configure({
        'controlPanelElements': ['play_pause', 'mute', 'volume', 'time_and_duration', 'spacer', 'quality', 'fullscreen'],
      });

      // 3. DRM Config (Aapke naye link se extracted keys)
      player.configure({
        drm: {
          clearKeys: {
            '2904b17cb64c996dbc254981b7602863': '66a7ef671b84498e64f966a7ef671b4e'
          }
        },
        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 12,
          rebufferingGoal: 2,
        }
      });

      // 4. Aapka naya Stream Link (Cleaned for Player)
      const manifestUri = "https://otte.live.fly.ww.aiv-cdn.net/syd-nitro/live/dash/enc/qkp4pavybn/out/v1/2298afadf64943adb0b44dc540ace1ce/cenc.mpd";

      try {
        await player.load(manifestUri);
        console.log("Success: Stream loaded!");
      } catch (e) {
        console.error("Load error code:", e.code, e);
      }
    }

    // Start when UI is ready
    document.addEventListener('shaka-ui-loaded', initApp);
    
    // Pehle click par audio enable karein
    window.addEventListener('click', () => {
        const video = document.getElementById('video');
        video.muted = false;
    }, { once: true });
  </script>
</body>
</html>
