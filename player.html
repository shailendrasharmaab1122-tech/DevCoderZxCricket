<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player - DevCoderz</title>

  <style>
    .glow-developer {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(16px, 2vw, 24px);
      font-weight: bold;
      color: #1e90ff;
      text-shadow: 0 0 5px #1e90ff, 0 0 20px #1e90ff, 0 0 40px #00ffff;
      z-index: 9999;
      pointer-events: none;
      font-family: sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    /* Blue Theme Controls */
    .shaka-range-element { color: #1e90ff !important; }
    .shaka-bottom-controls button { color: #1e90ff !important; }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">
</head>
<body>

  <div class="glow-developer">Developer - DevCoderz</div>

  <div id="player-container" data-shaka-player-container class="shaka-video-container" shaka-controls="true">
    <video autoplay muted playsinline id="video" class="shaka-video"></video>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>

  <script>
    async function initApp() {
      // Install built-in polyfills
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        alert('Browser support nahi kar raha!');
        return;
      }

      const video = document.getElementById('video');
      const container = document.getElementById('player-container');
      
      // Player init
      const player = new shaka.Player(video);
      
      // UI Overlay setup
      const ui = new shaka.ui.Overlay(player, container, video);
      
      // Blue Theme Config
      ui.configure({
        'controlPanelElements': ['play_pause', 'mute', 'volume', 'time_and_duration', 'spacer', 'quality', 'fullscreen'],
      });

      // CORRECT DRM CONFIG (From original stream data)
      player.configure({
        drm: {
          clearKeys: {
            '2904b17cb64c996dbc254981b7602863': '3adb0b44dc84498e64f966a7ef671b4e'
          }
        },
        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 10,
          rebufferingGoal: 2,
        }
      });

      // Clean MPD Link
      const manifestUri = "https://a201aivottlib9.maihd.net/OTTB/lhr-nitro/live/dash/enc/qkp4pavybn/cenc.mpd";

      try {
        await player.load(manifestUri);
        console.log("Success!");
      } catch (e) {
        console.error("Load error", e);
      }
    }

    document.addEventListener('shaka-ui-loaded', initApp);
    
    // User interaction to unmute
    window.addEventListener('click', () => {
        const video = document.getElementById('video');
        video.muted = false;
    }, { once: true });
  </script>
</body>
</html>
