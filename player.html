<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevCoderz Live Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; height: 100vh; overflow: hidden; font-family: sans-serif; }
    .glow-developer {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      font-size: 20px; font-weight: bold; color: #1e90ff;
      text-shadow: 0 0 10px #1e90ff, 0 0 20px #00ffff; z-index: 10; pointer-events: none;
    }
    #player-container { width: 100%; height: 100%; }
    video { width: 100%; height: 100%; }
    .shaka-video-container { width: 100%; height: 100%; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
</head>
<body>

  <div class="glow-developer">Developer - DevCoderz</div>

  <div id="player-container" data-shaka-player-container shaka-controls="true">
    <video autoplay muted playsinline id="video" class="shaka-video"></video>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>

  <script>
    async function initPlayer() {
      const video = document.getElementById('video');
      const container = document.getElementById('player-container');

      shaka.polyfill.installAll();
      const player = new shaka.Player(video);
      const ui = new shaka.ui.Overlay(player, container, video);

      // --- DRM & NETWORKING CONFIG ---
      player.configure({
        drm: {
          clearKeys: {
            // Naye link se extracted correct keys
            '2904b17cb64c996dbc254981b7602863': '66a7ef671b84498e64f94e8401fe8cb9'
          }
        },
        streaming: {
          rebufferingGoal: 2,
          bufferingGoal: 10,
          lowLatencyMode: true,
          jumpLargeGaps: true // Agar stream beech mein fase toh jump kar jaye
        }
      });

      // Networking filter to bypass some server restrictions
      player.getNetworkingEngine().registerRequestFilter((type, request) => {
        if (type === shaka.net.NetworkingEngine.RequestType.LICENSE) {
          console.log("License request sent");
        }
      });

      // Updated MPD Link
      const manifestUri = "https://otte.live.fly.ww.aiv-cdn.net/syd-nitro/live/dash/enc/qkp4pavybn/out/v1/2298afadf64943adb0b44dc540ace1ce/cenc.mpd";

      try {
        await player.load(manifestUri);
        console.log("Success! Video should be playing.");
      } catch (e) {
        console.error("Error Code:", e.code, "Check if keys are expired.");
      }
    }

    document.addEventListener('shaka-ui-loaded', initPlayer);

    // Unmute on first click
    window.addEventListener('click', () => {
        document.getElementById('video').muted = false;
    }, { once: true });
  </script>
</body>
</html>
