<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Sports 2 HD - Live</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/controls.css">
    <style>
        body { margin: 0; background: #000; display: flex; align-items: center; height: 100vh; }
        #video-container { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="video-container" data-shaka-player-container>
    <video data-shaka-player id="video" autoplay></video>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.3.5/dist/shaka-player.ui.js"></script>

<script>
// Aapka updated SS2 Manifest URL
const manifestUri = 'https://jiotvmblive.cdn.jio.com//bpk-tv/StarSportsHD2Hin_BTS/output/index.mpd?__hdnea__=st=1774648839~exp=1774735239~acl=/*~hmac=9c4b413ec2dc4f7dc1703988d9abc4902473253183e8b1140920ddfa29';

async function startPlayer() {
    const video = document.getElementById('video');
    const ui = video['ui'];
    const player = ui.getControls().getPlayer();

    // DRM ClearKey Configuration
    player.configure({
        drm: {
            clearKeys: {
                // API se mili hui values yahan daalein
                'YOUR_SS2_KEY_ID': 'YOUR_SS2_KEY'
            }
        },
        // Jio streams ke liye zaroori networking configuration
        streaming: {
            bufferingGoal: 30,
            rebufferingGoal: 15
        }
    });

    // Custom Header for JioTV (Optional but recommended)
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36';
    });

    try {
        await player.load(manifestUri);
        console.log('Star Sports 2 HD is LIVE!');
    } catch (error) {
        console.error('Error loading stream:', error);
    }
}

document.addEventListener('shaka-ui-loaded', startPlayer);
</script>
</body>
</html>
