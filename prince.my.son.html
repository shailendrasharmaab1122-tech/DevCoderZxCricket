<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Player | DevCoderz</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }

        #main-container { width: 100vw; height: 100vh; position: relative; }
        video { width: 100%; height: 100%; }

        /* Custom Watermark Style */
        .brand-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .status-dot {
            height: 6px;
            width: 6px;
            background: #00e5ff;
            border-radius: 50%;
            margin-right: 8px;
        }

        .brand-text {
            color: #eee;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .highlight { color: #00e5ff; font-weight: bold; }

        /* Splash Screen / Play Button */
        #splash-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #080808;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .play-card {
            background: #151515;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid #222;
        }

        .play-icon {
            font-size: 40px;
            color: #fff;
            background: #1e40af;
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            display: inline-block;
        }

        .btn-label { color: #fff; font-size: 14px; display: block; }
        #error-txt { color: #ff5252; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div id="main-container" data-shaka-player-container>
        <div class="brand-overlay">
            <div class="status-dot"></div>
            <div class="brand-text">Developer <span class="highlight">Devansh Sharma</span></div>
        </div>

        <div id="splash-screen">
            <div class="play-card" id="start-btn">
                <div class="play-icon">▶</div>
                <span class="btn-label">TAP TO LIVE STREAM</span>
                <div id="error-txt">STREAM IS CURRENTLY OFFLINE</div>
            </div>
        </div>

        <video id="my-video" data-shaka-player autoplay playsinline></video>
    </div>

    <script>
        // --- Configuration ---
        const STREAM_DATA = {
            url: 'https://jiotvmblive.cdn.jio.com/bpk-tv/Sports18_1_HD_BTS/output/dash/Sports18_1_HD_BTS.mpd',
            auth: 'st=1772060436~exp=1772146836~acl=/*~hmac=ee218933382193948827e81e4eb75f6f80c560694bb668ced4f7ba249e12e423',
            keys: {
                'b2cf15bfd938452188d457e3cdce6e02': '2b57ec437b7257b5af165d634ae2bfc7'
            }
        };

        async function setupPlayer() {
            const videoElem = document.getElementById('my-video');
            const containerElem = document.getElementById('main-container');
            const startBtn = document.getElementById('start-btn');
            const splash = document.getElementById('splash-screen');

            const player = new shaka.Player(videoElem);
            const ui = new shaka.ui.Overlay(player, containerElem, videoElem);

            // DRM aur Data Saving Setup
            player.configure({
                drm: { clearKeys: STREAM_DATA.keys },
                abr: {
                    enabled: true, // Network speed ke hisab se quality badlega
                    defaultBandwidthEstimate: 500000 // Kam quality se start karega
                },
                abrFactory: shaka.abr.SimpleAbrManager
            });

            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                const separator = request.uris[0].includes('?') ? '&' : '?';
                request.uris[0] += `${separator}__hdnea__=${STREAM_DATA.auth}`;
            });

            try {
                await player.load(STREAM_DATA.url);

                startBtn.onclick = () => {
                    videoElem.muted = false;
                    splash.style.display = 'none';
                    videoElem.play();
                };
            } catch (err) {
                console.error("Player Error:", err);
                document.getElementById('error-txt').style.display = 'block';
            }
        }

        document.addEventListener('shaka-ui-loaded', setupPlayer);
    </script>
</body>
</html>
