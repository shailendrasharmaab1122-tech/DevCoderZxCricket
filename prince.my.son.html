<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stream Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body, html { background: #000; color: #fff; height: 100vh; width: 100vw; overflow: hidden; }
        #wrapper { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        
        #play-overlay, #browser-error {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }

        #browser-error { display: none; background: #000; z-index: 200; }
        #browser-error h2 { color: #ff4b4b; margin-bottom: 10px; }

        .play-btn {
            width: 85px;
            height: 85px;
            background: #00f0ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
            margin-bottom: 20px;
            cursor: pointer;
        }
        .play-btn svg { fill: #000; width: 40px; height: 40px; margin-left: 5px; }
        #play-overlay p { font-weight: 800; font-size: 20px; letter-spacing: 2px; color: #00f0ff; text-transform: uppercase; }

        .inner-dev-tag {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 2147483647;
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 15px;
            border-radius: 50px;
            border: 1px solid #00f0ff;
            display: none;
            align-items: center;
            pointer-events: none;
            backdrop-filter: blur(15px);
        }
        .dot { height: 8px; width: 8px; background: #00f0ff; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 10px #00f0ff; animation: blink 1.2s infinite; }
        .inner-dev-tag div { font-size: 11px; font-weight: 600; color: #fff; white-space: nowrap; }
        .inner-dev-tag span { color: #00f0ff; font-weight: 800; margin-left: 4px; }
        
        iframe { width: 100%; height: 100%; border: none; display: none; background: #000; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="browser-error">
        <h2>Access Denied</h2>
        <p>This stream is only accessible on <b>Google Chrome Browser</b>.</p>
        <p style="font-size: 12px; color: #555; margin-top: 10px;">Please open the link in Chrome to watch.</p>
    </div>

    <div id="wrapper">
        <div id="play-overlay">
            <div class="play-btn" id="trigger">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <p>Tap To Play</p>
        </div>

        <iframe id="main-player" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
        
        <div class="inner-dev-tag" id="myTag">
            <div class="dot"></div>
            <div>Developer <span>Devansh Sharma</span></div>
        </div>
    </div>

<script>
    (function() {
        const overlay = document.getElementById('play-overlay');
        const errorDiv = document.getElementById('browser-error');
        const player = document.getElementById('main-player');
        const tag = document.getElementById('myTag');
        const wrapper = document.getElementById('wrapper');
        const trigger = document.getElementById('trigger');

        const isChrome = /Chrome/.test(navigator.userAgent) && /Google Inc/.test(navigator.vendor);
        const isEdge = /Edg/.test(navigator.userAgent);

        if (!isChrome || isEdge) {
            errorDiv.style.display = 'flex';
            overlay.style.display = 'none';
            return;
        }

        const streamBase = "aHR0cHM6Ly9tYXRjaGVzbGlua3oucGFnZXMuZGV2L2ppbz9pZD0zNjImYXV0b3BsYXk9MQ==";

        trigger.addEventListener('click', function() {
            overlay.style.display = 'none';
            player.style.display = 'block';
            tag.style.display = 'flex';
            player.src = atob(streamBase);
        });

        function handleFS() {
            if (document.fullscreenElement) {
                document.fullscreenElement.appendChild(tag);
            } else {
                wrapper.appendChild(tag);
            }
        }

        document.addEventListener('fullscreenchange', handleFS);
        document.addEventListener('webkitfullscreenchange', handleFS);

        setInterval(() => {
            if (document.fullscreenElement && !document.fullscreenElement.contains(tag)) {
                document.fullscreenElement.appendChild(tag);
            }
        }, 1000);
    })();
</script>
</body>
</html>
