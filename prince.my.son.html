<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stream Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; user-select: none; -webkit-user-select: none; }
        body, html { background: #000; color: #fff; height: 100vh; width: 100vw; overflow: hidden; position: fixed; }
        #wrapper { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        #err-scr { position: absolute; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; text-align: center; padding: 30px; }
        #play-ov { position: absolute; inset: 0; background: rgba(0,0,0,0.98); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; cursor: pointer; }
        .p-btn { width: 90px; height: 90px; background: #00f0ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 50px rgba(0, 240, 255, 0.6); margin-bottom: 25px; }
        .p-btn svg { fill: #000; width: 45px; height: 45px; margin-left: 6px; }
        #play-ov p { font-weight: 800; font-size: 22px; color: #00f0ff; text-transform: uppercase; }
        .inner-dev-tag { position: fixed; top: 15px; left: 15px; z-index: 2147483647; background: rgba(0, 0, 0, 0.9); padding: 8px 18px; border-radius: 50px; border: 1px solid #00f0ff; display: none; align-items: center; backdrop-filter: blur(20px); }
        .dot { height: 9px; width: 9px; background: #00f0ff; border-radius: 50%; margin-right: 12px; box-shadow: 0 0 12px #00f0ff; animation: blk 1.2s infinite; }
        .inner-dev-tag div { font-size: 12px; font-weight: 600; color: #fff; }
        .inner-dev-tag span { color: #00f0ff; font-weight: 800; margin-left: 5px; }
        iframe { width: 100%; height: 100%; border: none; display: none; background: #000; }
        @keyframes blk { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="err-scr">
        <h1 style="color: #00f0ff; font-size: 28px;">UNSUPPORTED BROWSER</h1>
        <p style="margin-top: 15px;">1DM, ADM and Other Downloaders are Blocked.</p>
        <p style="margin-top: 10px; color: #ff4b4b;">Please use the <b>Original Google Chrome</b> app.</p>
    </div>

    <div id="wrapper">
        <div id="play-ov">
            <div class="p-btn" id="start-trig">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <p>Tap To Play</p>
        </div>
        <iframe id="vid-frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
        <div class="inner-dev-tag" id="devTag">
            <div class="dot"></div>
            <div>Developer <span>Devansh Sharma</span></div>
        </div>
    </div>

<script>
(function(){
    const ua = navigator.userAgent;
    const vendor = navigator.vendor;
    
    // 1DM डिटेक्शन के लिए एडवांस चेक्स
    const is1DM = /1DM|ADM|AdvancedDownloadManager|Downloader/i.test(ua);
    const isChrome = /Chrome|CriOS/.test(ua) && /Google Inc/.test(vendor);
    const isEdge = /Edg/.test(ua);
    
    // 1DM अक्सर Chrome का नाटक करता है, इसलिए हम उसके 'internal' निशानों को ढूंढ रहे हैं
    if (is1DM || !isChrome || isEdge || (window.external && window.external.toString().includes('1DM'))) {
        document.getElementById('err-scr').style.display = 'flex';
        document.getElementById('wrapper').style.display = 'none';
        return;
    }

    const trig = document.getElementById('start-trig');
    const ovl = document.getElementById('play-ov');
    const frm = document.getElementById('vid-frame');
    const tag = document.getElementById('devTag');
    const s = "aHR0cHM6Ly9tYXRjaGVzbGlua3oucGFnZXMuZGV2L2ppbz9pZD0zNjImYXV0b3BsYXk9MQ==";

    trig.addEventListener('click', function() {
        ovl.style.display = 'none';
        frm.style.display = 'block';
        tag.style.display = 'flex';
        frm.src = atob(s);
    });

    // Anti-Inspect
    document.addEventListener('keydown', function(e) {
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) {
            e.preventDefault();
        }
    });

    // Fullscreen Tag Management
    function fs(){
        if(document.fullscreenElement){ document.fullscreenElement.appendChild(tag); }
        else { document.getElementById('wrapper').appendChild(tag); }
    }
    document.addEventListener('fullscreenchange', fs);
    document.addEventListener('webkitfullscreenchange', fs);
})();
</script>
</body>
</html>
