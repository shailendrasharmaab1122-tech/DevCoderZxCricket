<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stream Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body, html { background: #000; color: #fff; height: 100vh; width: 100vw; overflow: hidden; }
        #wrapper { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        
        #play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            cursor: pointer;
        }
        .play-btn {
            width: 80px;
            height: 80px;
            background: #00f0ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            margin-bottom: 15px;
        }
        .play-btn svg { fill: #000; width: 35px; height: 35px; margin-left: 5px; }
        #play-overlay p { font-weight: 600; font-size: 18px; letter-spacing: 1px; color: #00f0ff; }

        .inner-dev-tag {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 2147483647 !important;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 12px;
            border-radius: 50px;
            border: 1px solid #00f0ff;
            display: none;
            align-items: center;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }
        .dot { height: 7px; width: 7px; background: #00f0ff; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px #00f0ff; animation: blink 1.2s infinite; }
        .inner-dev-tag div { font-size: 10px; font-weight: 600; color: #fff; white-space: nowrap; }
        .inner-dev-tag span { color: #00f0ff; font-weight: 800; margin-left: 3px; }
        
        iframe { width: 100%; height: 100%; border: none; display: none; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="wrapper">
        <div id="play-overlay">
            <div class="play-btn">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <p>TAP TO PLAY</p>
        </div>

        <iframe id="main-player" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        
        <div class="inner-dev-tag" id="myTag">
            <div class="dot"></div>
            <div>Developer <span>Devansh Sharma</span></div>
        </div>
    </div>

<script>
    (function() {
        const overlay = document.getElementById('play-overlay');
        const player = document.getElementById('main-player');
        const tag = document.getElementById('myTag');
        const wrapper = document.getElementById('wrapper');
        const streamUrl = "aHR0cHM6Ly9tYXRjaGVzbGlua3oucGFnZXMuZGV2L2ppbz9pZD0zNjImYXV0b3BsYXk9MQ==";

        overlay.addEventListener('click', function() {
            overlay.style.display = 'none';
            player.style.display = 'block';
            tag.style.display = 'flex';
            player.src = atob(streamUrl);
        });

        function handleFS() {
            if (document.fullscreenElement) {
                document.fullscreenElement.appendChild(tag);
            } else {
                wrapper.appendChild(tag);
            }
        }

        document.addEventListener('fullscreenchange', handleFS);
        document.addEventListener('webkitfullscreenchange', handleFS);

        setInterval(() => {
            if (document.fullscreenElement && !document.fullscreenElement.contains(tag)) {
                document.fullscreenElement.appendChild(tag);
            }
        }, 1000);
    })();
</script>
</body>
</html>
