<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports18 LIVE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body, html { margin: 0; background: #000; height: 100%; overflow: hidden; }
        #player_wrap { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="player_wrap" data-shaka-player-container>
    <video id="video" data-shaka-player autoplay playsinline></video>
</div>

<script>
async function initPlayer() {
    const video = document.getElementById('video');
    const player = new shaka.Player(video);
    const container = document.getElementById('player_wrap');

    // UI Overlay Setup
    new shaka.ui.Overlay(player, container, video);

    // Sports18 DRM Configuration
    player.configure({
        drm: {
            clearKeys: {
                'b2cf15bfd938452188d457e3cdce6e02': '2b57ec437b7257b5af165d634ae2bfc7'
            }
        },
        streaming: {
            jumpLargeGaps: true,
            lowLatencyMode: true
        }
    });

    // JioTV Headers Bypass Logic
    player.getNetworkingEngine().registerRequestFilter(function(type, request) {
        request.headers['User-Agent'] = 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36';
        request.headers['Referer'] = 'https://www.jiotv.com/';
        request.headers['Origin'] = 'https://www.jiotv.com';
    });

    const url = "https://jiotvbpkmob.cdn.jio.com/bpk-tv/Sports18_1_HD_BTS/output/index.mpd?__hdnea__=st=1772191697~exp=1772278097~acl=/*~hmac=9eeb9b91c5a24edb651b3658d43b0c0f86ce5226f7eee44338ce364dcbf8ed0c";

    try {
        await player.load(url);
        console.log("Success! Stream loaded.");
    } catch (e) {
        // Asli error code dekhne ke liye alert
        alert("Shaka Error Code: " + e.code + "\nIska matlab hai: " + getErrorDescription(e.code));
    }
}

function getErrorDescription(code) {
    if (code == 1001) return "Network error ya CORS block (Domain issue)";
    if (code == 6007) return "DRM License error (Keys galat hain)";
    if (code == 1002) return "Bad URL (Token expire ho gaya)";
    return "Unknown error, console check karo.";
}

document.addEventListener('shaka-ui-loaded', initPlayer);
</script>
</body>
</html>
