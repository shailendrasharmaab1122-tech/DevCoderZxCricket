<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevCoderz</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        #player-ui-container { width: 100vw; height: 100vh; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }

        /* The manual trigger for audio */
        #click-to-unmute {
            position: absolute; inset: 0; z-index: 100;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); color: white; cursor: pointer;
            font-family: sans-serif;
        }
        .dev-badge {
            position: absolute; top: 15px; left: 15px; color: rgba(255,255,255,0.7);
            font-size: 12px; pointer-events: none; z-index: 99;
        }
    </style>
</head>
<body>

    <div id="player-ui-container" data-shaka-player-container>
        <div class="dev-badge">Developer - Devansh Sharma</div>

        <div id="click-to-unmute">
            <img src="https://cdn-icons-png.flaticon.com/512/727/727269.png" width="50" style="filter: invert(1);">
            <p style="margin-top:10px; font-weight: bold;">TAP TO UNMUTE</p>
        </div>

        <video id="video-element" data-shaka-player autoplay muted playsinline></video>
    </div>

    <script>
        // Updated manifest with your new URL parameters
        const manifestUri = 'https://jiotvmblive.cdn.jio.com/bpk-tv/Sports18_1_HD_BTS/output/dash/Sports18_1_HD_BTS.mpd';
        const licenseKey = 'b2cf15bfd938452188d457e3cdce6e02';
        const licenseValue = '2b57ec437b7257b5af165d634ae2bfc7';
        const token = 'st=1771822833~exp=1771909233~acl=/*~hmac=832db0a3594e0c64f46dd588fe7f8303ae15142a98351e784d85607e158e86b0';

        async function startStreaming() {
            const video = document.getElementById('video-element');
            const container = document.getElementById('player-ui-container');
            const unmuteLayer = document.getElementById('click-to-unmute');

            const player = new shaka.Player(video);
            const ui = new shaka.ui.Overlay(player, container, video);

            player.configure({
                drm: { clearKeys: { [licenseKey]: licenseValue } }
            });

            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                request.headers['User-Agent'] = 'com.jio.jiotv/7.0.8 (Linux; Android 9) ExoPlayerLib/2.13.2';
                request.uris[0] += (request.uris[0].includes('?') ? '&' : '?') + "__hdnea__=" + token;
            });

            try {
                await player.load(manifestUri);

                unmuteLayer.addEventListener('click', () => {
                    video.muted = false;
                    unmuteLayer.style.display = 'none';
                    video.play();
                });
            } catch (err) { console.log("Stream offline or error"); }
        }

        document.addEventListener('shaka-ui-loaded', startStreaming);
    </script>
</body>
</html>
