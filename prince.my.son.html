<title>Live Stream Player</title>

<style>
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #000; overflow: hidden; font-family: sans-serif;
    }

    #player_wrap {
        width: 100%; height: 100%; position: relative;
    }

    video {
        width: 100%; height: 100%; object-fit: contain;
    }

    /* Developer Branding */
    .dev-header {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 16px;
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        pointer-events: none;
        backdrop-filter: blur(10px);
    }

    .live-dot {
        height: 10px; width: 10px;
        background: #ff0000;
        border-radius: 50%;
        margin-right: 10px;
        box-shadow: 0 0 10px #ff0000;
        animation: blink 1.5s infinite;
    }

    .dev-name {
        color: #fff;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
    }

    .dev-name span {
        color: #00f0ff;
        font-weight: 800;
    }

    #channelTitle {
        position: absolute;
        bottom: 110px;
        left: 20px;
        color: #fff;
        background: rgba(255, 0, 0, 0.8);
        padding: 5px 12px;
        border-radius: 4px;
        z-index: 999;
        font-size: 14px;
        font-weight: bold;
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

    /* Manual Play Button if Autoplay fails */
    #manualPlayButton {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        background: #00f0ff;
        color: #000;
        padding: 15px 30px;
        border: none;
        border-radius: 50px;
        font-weight: bold;
        display: none;
        z-index: 2000;
        cursor: pointer;
    }
</style>
</head>
