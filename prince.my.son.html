<!DOCTYPE html>
<html>
<head>
    <title>Fixed Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        video { width: 100%; height: 100%; max-height: 100vh; outline: none; }
    </style>
</head>
<body>

<video id="video" controls autoplay playsinline crossorigin="anonymous"></video>

<script>
async function initPlayer() {
    const video = document.getElementById('video');
    const player = new shaka.Player(video);

    // Star Sports 1 Hindi Config
    const manifestUri = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
    const keyId = "400131994b445d8c8817202248760fda";
    const key = "2d56cb6f07a75b9aff165d534ae2bfc4";

    player.configure({
        drm: {
            clearKeys: {
                [keyId]: key
            }
        },
        streaming: {
            // Isse black screen ya stuck hone ki problem solve hoti hai
            jumpLargeGaps: true 
        }
    });

    // Networking filters for JIO Bypass
    player.getNetworkingEngine().registerRequestFilter(function(type, request) {
        // Headers jo Jio mangta hai
        request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
        request.headers['Referer'] = 'https://www.jiotv.com/';
        
        // Agar manifest load ho raha hai toh token append karna
        // Note: Filhal hum wahi token use kar rahe jo link mein ho sakta hai
    });

    try {
        // Bina kisi extra API ke direct load karke dekhte hain
        // Kyunki keys 'ClearKey' hain, toh ye direct chalni chahiye
        await player.load(manifestUri);
        console.log('The video has now been loaded!');
    } catch (e) {
        console.error('Error loading:', e);
    }
}

document.addEventListener('DOMContentLoaded', initPlayer);
</script>
</body>
</html>
