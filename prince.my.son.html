<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stream Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body, html { background: #000; color: #fff; height: 100vh; width: 100vw; overflow: hidden; }
        #wrapper { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        .inner-dev-tag {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 2147483647 !important;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 12px;
            border-radius: 50px;
            border: 1px solid #00f0ff;
            display: flex;
            align-items: center;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }
        .dot { height: 7px; width: 7px; background: #00f0ff; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 8px #00f0ff; animation: blink 1.2s infinite; }
        .inner-dev-tag div { font-size: 10px; font-weight: 600; color: #fff; white-space: nowrap; }
        .inner-dev-tag span { color: #00f0ff; font-weight: 800; margin-left: 3px; }
        video { width: 100%; height: 100%; object-fit: contain; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body oncontextmenu="return false;">
    <div id="wrapper">
        <video id="main-player" crossorigin="anonymous" controls autoplay playsinline></video>
        <div class="inner-dev-tag" id="myTag">
            <div class="dot"></div>
            <div>Developer <span>Devansh Sharma</span></div>
        </div>
    </div>
<script>
    (function() {
        const _p = "aHR0cHM6Ly9kYXNoLnZvZGVwMzkyNDAzMjcud29ya2Vycy5kZXYvP3VybD0=";
        const _m = "aHR0cHM6Ly9qaW90dmJwa21vYi5jZG4uamlvLmNvbS9icGstdHYvU3Rhcl9TcG9ydHNfMV9IaW5kaV9CVFMvb3V0cHV0L2luZGV4Lm1wZD9fX2hkbmVhX189c3Q9MTc3MjMzMDAyNn5leHA9MTc3MjQxNjQyNn5hY2w9Lyp+aG1hYz1lYjhmZDIxMzA3OTNkYmZmYmZiMmE4MGY0NTU3ZTIwZTlhYjA4MWJiNjVmMDEyMGEyNWQ1NjU1MjU2N2U4ODY0";
        const _k = "YmQxZWE2YTFjMWZiNWRjZGI3MDk0MzRlMDgyNmJiYzA=";
        const _v = "ZjU3ZjIyY2JhMzI3MzljZTdiZWIxZmFiM2YzZDA2MGI=";
        
        const video = document.getElementById('main-player');
        const tag = document.getElementById('myTag');
        const wrapper = document.getElementById('wrapper');

        async function init() {
            const player = new shaka.Player(video);
            player.configure({
                drm: { clearKeys: { [atob(_k)]: atob(_v) } },
                streaming: { rebufferingGoal: 2 }
            });

            try {
                await player.load(atob(_p) + encodeURIComponent(atob(_m)));
            } catch (e) {
                console.error("Load failed");
            }
        }

        document.addEventListener('DOMContentLoaded', init);

        function handleFS() {
            if (document.fullscreenElement) {
                document.fullscreenElement.appendChild(tag);
            } else {
                wrapper.appendChild(tag);
            }
        }

        document.addEventListener('fullscreenchange', handleFS);
        document.addEventListener('webkitfullscreenchange', handleFS);
        setInterval(() => {
            if (document.fullscreenElement && !document.fullscreenElement.contains(tag)) {
                document.fullscreenElement.appendChild(tag);
            }
        }, 1000);
    })();
</script>
</body>
</html>
