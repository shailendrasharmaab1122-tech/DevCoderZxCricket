<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderz | Live Stream</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    
    <style>
        body { margin: 0; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #video-container { width: 100vw; height: 100vh; background: #000; position: relative; }
        video { width: 100%; height: 100%; }

        /* Modern Landing Overlay */
        #gatekeeper {
            position: absolute; inset: 0; z-index: 1000;
            background: radial-gradient(circle, #1a1a2e 0%, #000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .play-wrapper {
            padding: 40px; border-radius: 30px; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            text-align: center; cursor: pointer;
        }
        .play-btn {
            width: 80px; height: 80px; background: #2563eb; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px; box-shadow: 0 0 30px rgba(37, 99, 235, 0.5);
            font-size: 30px; color: white;
        }
        .status-text { color: white; letter-spacing: 2px; font-weight: 600; margin: 0; }
        .error-tag { color: #ff4757; font-size: 14px; margin-top: 15px; display: none; }
        
        .watermark {
            position: absolute; top: 20px; left: 20px; color: rgba(255,255,255,0.3);
            font-size: 13px; pointer-events: none; z-index: 10;
        }
    </style>
</head>
<body>

    <div id="video-container" data-shaka-player-container>
        <div class="watermark">Developer - Devansh Sharma</div>
        
        <div id="gatekeeper">
            <div class="play-wrapper" id="launch-trigger">
                <div class="play-btn">▶</div>
                <p class="status-text">CLICK TO PLAY LIVE</p>
                <div id="error-msg" class="error-tag">STREAM OFFLINE - CHECK TOKEN</div>
            </div>
        </div>

        <video id="video-feed" data-shaka-player autoplay muted playsinline></video>
    </div>

    <script>
        // Updated configurations based on your new link
        const LIVE_DATA = {
            manifest: 'https://jiotvmblive.cdn.jio.com/bpk-tv/Sports18_1_HD_BTS/output/dash/Sports18_1_HD_BTS.mpd',
            token: 'st=1771898442~exp=1771984842~acl=/*~hmac=2a5fbf41872bf78460f38b11e59b6b22f0c01a9ade555e219669e96c10a9d716',
            keyId: 'b2cf15bfd938452188d457e3cdce6e02',
            keyValue: '2b57ec437b7257b5af165d634ae2bfc7'
        };

        async function bootstrap() {
            const video = document.getElementById('video-feed');
            const container = document.getElementById('video-container');
            const gate = document.getElementById('gatekeeper');
            const errorTag = document.getElementById('error-msg');
            const trigger = document.getElementById('launch-trigger');

            const player = new shaka.Player(video);
            const ui = new shaka.ui.Overlay(player, container, video);

            // DRM & Buffer Settings
            player.configure({
                drm: { clearKeys: { [LIVE_DATA.keyId]: LIVE_DATA.keyValue } },
                streaming: {
                    bufferingGoal: 10,
                    failureCallback: () => location.reload() 
                }
            });

            // Token Implementation
            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                const glue = request.uris[0].includes('?') ? '&' : '?';
                request.uris[0] += `${glue}__hdnea__=${LIVE_DATA.token}`;
            });

            try {
                await player.load(LIVE_DATA.manifest);
                
                trigger.addEventListener('click', () => {
                    video.muted = false;
                    gate.style.opacity = '0';
                    setTimeout(() => gate.style.display = 'none', 600);
                    video.play();
                });
            } catch (err) {
                console.error("Critical Error", err);
                errorTag.style.display = 'block';
            }
        }

        document.addEventListener('shaka-ui-loaded', bootstrap);
    </script>
</body>
</html>
