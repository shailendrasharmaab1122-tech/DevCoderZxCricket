<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nitro Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #container { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="container" data-shaka-player-container>
    <video id="video" data-shaka-player autoplay playsinline></video>
</div>

<script>
    async function startPlayer() {
        const video = document.getElementById('video');
        const container = document.getElementById('container');
        const player = new shaka.Player(video);

        // UI Setup
        const ui = new shaka.ui.Overlay(player, container, video);

        // Configuration: Direct Keys from your link
        player.configure({
            drm: {
                clearKeys: {
                    '3b1768e88fe20087baaa029ece65cc59': '8ab5b1d0808ac9e3811750a0713d114e'
                }
            }
        });

        // Load the manifest
        const uri = 'https://otte.live.fly.ww.aiv-cdn.net/pdx-nitro/live/clients/dash/enc/rxhxc14ikz/out/v1/bb976c39247941f3b4c9fa0a0735426d/cenc.mpd';
        
        try {
            await player.load(uri);
            console.log('Stream loaded successfully!');
        } catch (error) {
            console.error('Error loading stream:', error);
            alert('Link Expired or Error: ' + error.code);
        }
    }

    // Initialize on load
    document.addEventListener('shaka-ui-loaded', startPlayer);
</script>

</body>
</html>
