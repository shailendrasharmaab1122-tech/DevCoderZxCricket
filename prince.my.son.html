<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderz | Live Stream</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

    <style>
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; }
        #video-container { width: 100vw; height: 100vh; background: #000; position: relative; }
        video { width: 100%; height: 100%; }

        /* --- Compact Watermark (Size Chota, No Blur) --- */
        .dev-watermark {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: rgba(0, 0, 0, 0.6); /* Simple transperent background */
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            pointer-events: none;
        }

        .dot {
            height: 5px;
            width: 5px;
            background: #00d2ff;
            border-radius: 50%;
        }

        .dev-text {
            color: #fff;
            font-size: 10px; /* Small font size */
            font-weight: 400;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .dev-name {
            color: #00d2ff;
            font-weight: 700;
        }

        /* --- Gatekeeper --- */
        #gatekeeper {
            position: absolute; inset: 0; z-index: 1000;
            background: #000; display: flex; align-items: center; justify-content: center;
            transition: opacity 0.5s;
        }
        .play-wrapper {
            padding: 30px; border-radius: 15px; background: #111;
            border: 1px solid #222; text-align: center; cursor: pointer;
        }
        .play-btn {
            width: 70px; height: 70px; background: #2563eb; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 15px; font-size: 24px; color: white;
        }
        .status-text { color: white; font-size: 12px; font-weight: 600; margin: 0; }
        .error-tag { color: #ff4757; font-size: 12px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div id="video-container" data-shaka-player-container>
        <div class="dev-watermark">
            <div class="dot"></div>
            <div class="dev-text">DEVELOPER <span class="dev-name">DEVANSH SHARMA</span></div>
        </div>

        <div id="gatekeeper">
            <div class="play-wrapper" id="launch-trigger">
                <div class="play-btn">▶</div>
                <p class="status-text">INITIALIZE STREAM</p>
                <div id="error-msg" class="error-tag">OFFLINE</div>
            </div>
        </div>

        <video id="video-feed" data-shaka-player autoplay muted playsinline></video>
    </div>

    <script>
        const CONFIG = {
            manifest: 'https://jiotvmblive.cdn.jio.com/bpk-tv/Sports18_1_HD_BTS/output/dash/Sports18_1_HD_BTS.mpd',
            token: 'st=1771898442~exp=1771984842~acl=/*~hmac=2a5fbf41872bf78460f38b11e59b6b22f0c01a9ade555e219669e96c10a9d716',
            drm: {
                keyId: 'b2cf15bfd938452188d457e3cdce6e02',
                keyValue: '2b57ec437b7257b5af165d634ae2bfc7'
            }
        };

        async function initApp() {
            const video = document.getElementById('video-feed');
            const container = document.getElementById('video-container');
            const gate = document.getElementById('gatekeeper');
            const errorTag = document.getElementById('error-msg');
            const trigger = document.getElementById('launch-trigger');

            const player = new shaka.Player(video);
            new shaka.ui.Overlay(player, container, video);

            player.configure({
                drm: { clearKeys: { [CONFIG.drm.keyId]: CONFIG.drm.keyValue } }
            });

            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                const glue = request.uris[0].includes('?') ? '&' : '?';
                request.uris[0] += `${glue}__hdnea__=${CONFIG.token}`;
            });

            try {
                await player.load(CONFIG.manifest);
                trigger.addEventListener('click', () => {
                    video.muted = false;
                    gate.style.opacity = '0';
                    setTimeout(() => gate.style.display = 'none', 500);
                    video.play();
                });
            } catch (e) {
                errorTag.style.display = 'block';
            }
        }

        document.addEventListener('shaka-ui-loaded', initApp);
    </script>
</body>
</html>
