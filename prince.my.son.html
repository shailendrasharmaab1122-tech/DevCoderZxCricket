<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Sports 1 HD - Devansh Sharma</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; outline: none; }
        .watermark { position: fixed; top: 15px; left: 15px; z-index: 100; background: rgba(0,240,255,0.3); border: 1px solid #00f0ff; color: #fff; padding: 5px 15px; border-radius: 50px; font-family: sans-serif; font-size: 12px; pointer-events: none; backdrop-filter: blur(5px); }
    </style>
</head>
<body>

    <div class="watermark">Developer: <b>Devansh Sharma</b></div>
    <video id="video" controls autoplay playsinline crossorigin="anonymous"></video>

<script>
async function initPlayer() {
    const video = document.getElementById('video');
    const player = new shaka.Player(video);

    // Naya MPD Link aur Token
    const manifestUri = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
    const token = "st=1772683607~exp=1772770007~acl=/*~hmac=45c14d0e25581c8ceb3b1e8b9e0bbd8140b390fc5443f376097fb1e847987bd9";
    
    // ClearKey DRM
    const kid = "400131994b445d8c8817202248760fda";
    const key = "2d56cb6f07a75b9aff165d534ae2bfc4";

    player.configure({
        drm: { clearKeys: { [kid]: key } },
        streaming: { jumpLargeGaps: true }
    });

    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
        request.headers['Referer'] = 'https://www.jiotv.com/';
        
        // Token ko link mein jodna
        if (!request.uris[0].includes('__hdnea__')) {
            request.uris[0] += (request.uris[0].includes('?') ? '&' : '?') + '__hdnea__=' + token;
        }
    });

    try {
        await player.load(manifestUri);
        console.log("Stream Started!");
    } catch (e) {
        console.error("Error:", e);
    }
}

document.addEventListener('DOMContentLoaded', initPlayer);
</script>
</body>
</html>
