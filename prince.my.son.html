<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports18 HD Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player_wrap { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; }
    </style>
</head>
<body>

<div id="player_wrap" data-shaka-player-container>
    <video id="main_player" data-shaka-player autoplay playsinline></video>
</div>

<script>
async function setupPlayer() {
    const video = document.getElementById('main_player');
    const container = document.getElementById('player_wrap');
    const player = new shaka.Player(video);

    // UI interface setup
    new shaka.ui.Overlay(player, container, video);

    // DRM Configuration (Sports18 Keys)
    player.configure({
        drm: {
            clearKeys: {
                'b2cf15bfd938452188d457e3cdce6e02': '2b57ec437b7257b5af165d634ae2bfc7'
            }
        },
        streaming: {
            jumpLargeGaps: true
        }
    });

    // JioTV Network Filter
    player.getNetworkingEngine().registerRequestFilter(function(type, request) {
        // Essential Headers
        request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36';
        request.headers['Referer'] = 'https://www.jiotv.com/';
        request.headers['Origin'] = 'https://www.jiotv.com';
    });

    const m3u8Url = "https://jiotvbpkmob.cdn.jio.com/bpk-tv/Sports18_1_HD_BTS/output/index.mpd?__hdnea__=st=1772191697~exp=1772278097~acl=/*~hmac=9eeb9b91c5a24edb651b3658d43b0c0f86ce5226f7eee44338ce364dcbf8ed0c";

    try {
        await player.load(m3u8Url);
        console.log("Success: Stream Loaded");
    } catch (e) {
        console.error("Error Detail:", e);
        if(e.code == 1001) {
            alert("DNS/CORS Error: Browser ne request block kar di hai.");
        } else {
            alert("Error Code: " + e.code + " - Check Console.");
        }
    }
}

document.addEventListener('shaka-ui-loaded', setupPlayer);
</script>
</body>
</html>
