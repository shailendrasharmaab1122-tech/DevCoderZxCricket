<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Stream Player</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { background: #000; height: 100%; width: 100%; overflow: hidden; font-family: sans-serif; }

        /* Branding Styles */
        .dev-credit {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 15px;
            border-radius: 50px;
            border: 1px solid #00f0ff;
            display: flex;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .live-dot {
            height: 8px; width: 8px;
            background: #ff0000;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 8px #ff0000;
            animation: blink 1.2s infinite;
        }
        .dev-text { color: #fff; font-size: 13px; font-weight: bold; }
        .dev-text span { color: #00f0ff; }

        /* Video Container */
        #video_container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        video { width: 100%; height: 100%; object-fit: contain; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

<div id="video_container" data-shaka-player-container>
    <div class="dev-credit">
        <div class="live-dot"></div>
        <div class="dev-text">Developer: <span>Devansh Sharma</span></div>
    </div>

    <video id="main_player" data-shaka-player autoplay playsinline></video>
</div>

<script>
    // Configuration - Yahan apna data dalo
    const manifestUri = "https://jiotvbpkmob.cdn.jio.com/bpk-tv/Sports18_1_HD_BTS/output/index.mpd?__hdnea__=st=1772191697~exp=1772278097~acl=/*~hmac=9eeb9b91c5a24edb651b3658d43b0c0f86ce5226f7eee44338ce364dcbf8ed0c";
    
    // DRM Keys (KeyID : Key)
    const clearKeys = {
        'b2cf15bfd938452188d457e3cdce6e02': '2b57ec437b7257b5af165d634ae2bfc7'
    };

    async function initPlayer() {
        const video = document.getElementById('main_player');
        const container = document.getElementById('video_container');
        const player = new shaka.Player(video);

        // UI Setup
        new shaka.ui.Overlay(player, container, video);

        // DRM Configuration
        player.configure({
            drm: {
                clearKeys: clearKeys
            },
            streaming: {
                jumpLargeGaps: true
            }
        });

        // Network Filters (JioTV ke liye zaroori)
        player.getNetworkingEngine().registerRequestFilter(function(type, request) {
            request.headers['User-Agent'] = 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36';
            request.headers['Referer'] = 'https://www.jiotv.com/';
        });

        // Load the Stream
        try {
            await player.load(manifestUri);
            console.log('Player initialized by Devansh Sharma');
        } catch (e) {
            console.error('Error loading stream', e);
            if(e.code == 1001) alert("CORS Error: Please host this on a server or use CORS extension.");
        }
    }

    // Start Everything
    document.addEventListener('shaka-ui-loaded', initPlayer);
</script>

</body>
</html>
