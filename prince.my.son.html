<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Star Sports 1 HD - Devansh</title>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body, html { background: #000; height: 100vh; width: 100vw; overflow: hidden; }
        .shaka-video-container { width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: contain; }
        
        #play-overlay { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; cursor: pointer; }
        .play-btn { width: 85px; height: 85px; background: #00f0ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(0, 240, 255, 0.5); margin-bottom: 20px; }
        .play-btn svg { fill: #000; width: 40px; height: 40px; margin-left: 5px; }
        #play-overlay p { font-weight: 800; font-size: 20px; color: #00f0ff; text-transform: uppercase; }

        .inner-dev-tag { position: fixed; top: 15px; left: 15px; z-index: 2147483647; background: rgba(0, 0, 0, 0.8); padding: 6px 15px; border-radius: 50px; border: 1px solid #00f0ff; display: none; align-items: center; pointer-events: none; }
        .dot { height: 8px; width: 8px; background: #00f0ff; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 10px #00f0ff; animation: blink 1.2s infinite; }
        .inner-dev-tag span { color: #00f0ff; font-weight: 800; margin-left: 4px; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="play-overlay">
        <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <p>Start Streaming</p>
    </div>

    <div class="shaka-video-container" id="player-container">
        <video id="video" autoplay playsinline></video>
        <div class="inner-dev-tag" id="myTag">
            <div class="dot"></div>
            <div>Developer <span>Devansh Sharma</span></div>
        </div>
    </div>

<script>
const CONFIG = {
    streamUrl: "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd",
    keyId: "400131994b445d8c8817202248760fda",
    key: "2d56cb6f07a75b9aff165d534ae2bfc4",
    cookieUrl: "https://allrounder-live.pages.dev/api/cookie.json"
};

async function initApp() {
    shaka.polyfill.installAll();
    const video = document.getElementById('video');
    const container = document.getElementById('player-container');
    const player = new shaka.Player(video);
    const ui = new shaka.ui.Overlay(player, container, video);

    player.configure({
        drm: { clearKeys: { [CONFIG.keyId]: CONFIG.key } },
        manifest: { defaultPresentationDelay: 5 },
        streaming: { lowLatencyMode: true }
    });

    try {
        const response = await fetch(CONFIG.cookieUrl);
        const data = await response.json();
        const cookieValue = data.cookie || "";

        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
            request.headers["Referer"] = "https://www.jiotv.com/";
            if (cookieValue) {
                request.headers["Cookie"] = cookieValue;
                const token = cookieValue.startsWith("__hdnea__=") ? cookieValue.substring(10) : cookieValue;
                if (!request.uris[0].includes("__hdnea__")) {
                    request.uris[0] += (request.uris[0].includes("?") ? "&" : "?") + "__hdnea__=" + token;
                }
            }
        });

        await player.load(CONFIG.streamUrl);
    } catch (e) { console.error(e); }
}

document.getElementById('play-overlay').addEventListener('click', () => {
    document.getElementById('play-overlay').style.display = 'none';
    document.getElementById('myTag').style.display = 'flex';
    initApp();
});
</script>
</body>
</html>
