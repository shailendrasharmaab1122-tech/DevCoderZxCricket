<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devansh Sharma Player - Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { margin: 0; background: #000; height: 100vh; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; background: #000; }
        .tag { position: fixed; top: 10px; left: 10px; color: #00f0ff; font-family: sans-serif; font-size: 12px; z-index: 10; padding: 5px 10px; border: 1px solid #00f0ff; border-radius: 20px; background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div class="tag">Developer: <b>Devansh Sharma</b></div>
    <video id="video" controls autoplay playsinline></video>

<script>
async function startPlayer() {
    const video = document.getElementById('video');
    const player = new shaka.Player(video);

    // --- AAPKA NAYA DATA ---
    const manifestUri = "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd";
    const nayaToken = "st=1772683607~exp=1772770007~acl=/*~hmac=45c14d0e25581c8ceb3b1e8b9e0bbd8140b390fc5443f376097fb1e847987bd9";
    const kid = "400131994b445d8c8817202248760fda";
    const key = "2d56cb6f07a75b9aff165d534ae2bfc4";

    player.configure({
        drm: { clearKeys: { [kid]: key } },
        streaming: { 
            jumpLargeGaps: true,
            forceTransmuxTS: true 
        }
    });

    // Networking Filter: Ye har request (manifest aur video segments) ko modify karega
    player.getNetworkingEngine().registerRequestFilter((type, request) => {
        // Headers bypass
        request.headers['User-Agent'] = 'plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6';
        request.headers['Referer'] = 'https://www.jiotv.com/';
        request.headers['Origin'] = 'https://www.jiotv.com';

        // Har request ke URL mein token add karna
        if (!request.uris[0].includes('__hdnea__')) {
            const separator = request.uris[0].includes('?') ? '&' : '?';
            request.uris[0] += separator + '__hdnea__=' + nayaToken;
        }
    });

    try {
        await player.load(manifestUri);
        console.log("Success: Playing!");
    } catch (e) {
        console.error("Error code", e.code, "object", e);
    }
}

document.addEventListener('DOMContentLoaded', startPlayer);
</script>
</body>
</html>
