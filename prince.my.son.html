<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCoderz | Live Stream</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">

    <style>
        body { 
            margin: 0; 
            background: #000; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden;
        }

        #video-container { 
            width: 100vw; 
            height: 100vh; 
            background: #000; 
            position: relative; 
        }

        video { 
            width: 100%; 
            height: 100%; 
        }

        /* --- Minimalist & Human-Coded Watermark --- */
        .dev-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            /* Blur hata diya gaya hai - clean transperent look */
            background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            pointer-events: none;
        }

        .dot {
            height: 6px;
            width: 6px;
            background: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00d2ff;
        }

        .dev-info {
            color: #eee;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .dev-name-bold {
            color: #00d2ff;
            font-weight: 700;
        }

        /* --- Landing Overlay --- */
        #gatekeeper {
            position: absolute; 
            inset: 0; 
            z-index: 1000;
            background: #000;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            transition: opacity 0.6s ease;
        }

        .play-wrapper {
            padding: 40px; 
            border-radius: 20px; 
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            text-align: center; 
            cursor: pointer;
        }

        .play-btn {
            width: 80px; 
            height: 80px; 
            background: #2563eb;
            border-radius: 50%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            margin: 0 auto 20px; 
            font-size: 28px; 
            color: white;
        }

        .status-text { 
            color: #fff; 
            letter-spacing: 2px; 
            font-size: 13px;
            font-weight: 600; 
            margin: 0; 
        }

        .error-tag { 
            color: #ff4757; 
            font-size: 13px; 
            margin-top: 15px; 
            display: none; 
        }
    </style>
</head>
<body>

    <div id="video-container" data-shaka-player-container>
        <div class="dev-tag">
            <div class="dot"></div>
            <div class="dev-info">Dev: <span class="dev-name-bold">Devansh Sharma</span></div>
        </div>

        <div id="gatekeeper">
            <div class="play-wrapper" id="launch-trigger">
                <div class="play-btn">▶</div>
                <p class="status-text">CLICK TO PLAY</p>
                <div id="error-msg" class="error-tag">STREAM OFFLINE</div>
            </div>
        </div>

        <video id="video-feed" data-shaka-player autoplay muted playsinline></video>
    </div>

    <script>
        const CONFIG = {
            manifest: 'https://jiotvmblive.cdn.jio.com/bpk-tv/Sports18_1_HD_BTS/output/dash/Sports18_1_HD_BTS.mpd',
            token: 'st=1771898442~exp=1771984842~acl=/*~hmac=2a5fbf41872bf78460f38b11e59b6b22f0c01a9ade555e219669e96c10a9d716',
            drm: {
                keyId: 'b2cf15bfd938452188d457e3cdce6e02',
                keyValue: '2b57ec437b7257b5af165d634ae2bfc7'
            }
        };

        async function initApp() {
            const video = document.getElementById('video-feed');
            const container = document.getElementById('video-container');
            const gate = document.getElementById('gatekeeper');
            const errorTag = document.getElementById('error-msg');
            const trigger = document.getElementById('launch-trigger');

            const player = new shaka.Player(video);
            const ui = new shaka.ui.Overlay(player, container, video);

            player.configure({
                drm: { clearKeys: { [CONFIG.drm.keyId]: CONFIG.drm.keyValue } },
                streaming: { bufferingGoal: 10 }
            });

            player.getNetworkingEngine().registerRequestFilter((type, request) => {
                const glue = request.uris[0].includes('?') ? '&' : '?';
                request.uris[0] += `${glue}__hdnea__=${CONFIG.token}`;
            });

            try {
                await player.load(CONFIG.manifest);
                trigger.addEventListener('click', () => {
                    video.muted = false;
                    gate.style.opacity = '0';
                    setTimeout(() => gate.style.display = 'none', 600);
                    video.play();
                });
            } catch (e) {
                errorTag.style.display = 'block';
            }
        }

        document.addEventListener('shaka-ui-loaded', initApp);
    </script>
</body>
</html>
