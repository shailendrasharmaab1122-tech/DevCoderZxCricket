<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live Sports</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
    <style>
        body { margin:0; background:#000; height:100vh; display:flex; flex-direction:column; justify-content:center; }
        #wrapper { width:100%; height:100%; position:relative; }
        video { width:100%; height:100%; }
    </style>
</head>
<body>

<div id="wrapper" data-shaka-player-container>
    <video id="video" data-shaka-player autoplay playsinline></video>
</div>

<script>
async function init() {
    const video = document.getElementById('video');
    const wrapper = document.getElementById('wrapper');
    const player = new shaka.Player(video);

    // UI interface setup
    new shaka.ui.Overlay(player, wrapper, video);

    // Sports18 DRM Keys (Ye keys valid honi chahiye)
    player.configure({
        drm: {
            clearKeys: {
                'b2cf15bfd938452188d457e3cdce6e02': '2b57ec437b7257b5af165d634ae2bfc7'
            }
        }
    });

    // JioTV Headers: Iske bina 403 error aayega
    player.getNetworkingEngine().registerRequestFilter(function(type, request) {
        request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36';
        request.headers['Referer'] = 'https://www.jiotv.com/';
    });

    const url = "https://jiotvbpkmob.cdn.jio.com/bpk-tv/Sports18_1_HD_BTS/output/index.mpd?__hdnea__=st=1772191697~exp=1772278097~acl=/*~hmac=9eeb9b91c5a24edb651b3658d43b0c0f86ce5226f7eee44338ce364dcbf8ed0c";

    try {
        await player.load(url);
    } catch (e) {
        console.error("Error code:", e.code, e);
        alert("Nahi chala! Ya toh Token expire ho gaya hai ya Keys block hain.");
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
