<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Fixed Stream - Devansh</title>
    <script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { background: #000; height: 100vh; width: 100vw; overflow: hidden; }
        #player-container { width: 100%; height: 100%; background: #000; }
        video { width: 100%; height: 100%; }
        
        #play-overlay { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; cursor: pointer; color: #00f0ff; font-family: sans-serif; }
        .play-btn { width: 80px; height: 80px; background: #00f0ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
        .play-btn svg { fill: #000; width: 40px; }
    </style>
</head>
<body>

    <div id="play-overlay" onclick="startStream()">
        <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <p>TAP TO FIX & PLAY</p>
    </div>

    <div class="shaka-video-container" id="player-container" shaka-controls="true">
        <video id="video" autoplay playsinline crossorigin="anonymous"></video>
    </div>

<script>
async function startStream() {
    document.getElementById('play-overlay').style.display = 'none';
    
    shaka.polyfill.installAll();
    const video = document.getElementById('video');
    const container = document.getElementById('player-container');
    const player = new shaka.Player(video);
    const ui = new shaka.ui.Overlay(player, container, video);

    const config = {
        streamUrl: "https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_HD1_Hindi_BTS/output/index.mpd",
        keyId: "400131994b445d8c8817202248760fda",
        key: "2d56cb6f07a75b9aff165d534ae2bfc4",
        cookieApi: "https://allrounder-live.pages.dev/api/cookie.json"
    };

    player.configure({
        drm: { clearKeys: { [config.keyId]: config.key } },
        streaming: {
            jumpLargeGaps: true,
            bufferingGoal: 30,
            rebufferingGoal: 2
        }
    });

    try {
        // Fetch Fresh Cookie
        const res = await fetch(config.cookieApi);
        const data = await res.json();
        const cookie = data.cookie || "";

        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            // Jio Server requirements
            request.headers["User-Agent"] = "plaYtv/7.1.5 (Linux;Android 13) ExoPlayerLib/2.11.6";
            request.headers["Origin"] = "https://www.jiotv.com";
            request.headers["Referer"] = "https://www.jiotv.com/";

            if (cookie) {
                const tokenOnly = cookie.replace("__hdnea__=", "");
                // Har request ke URL mein token append karna zaroori hai
                if (!request.uris[0].includes("__hdnea__")) {
                    const separator = request.uris[0].includes("?") ? "&" : "?";
                    request.uris[0] += separator + "__hdnea__=" + tokenOnly;
                }
            }
        });

        await player.load(config.streamUrl);
        video.play();
    } catch (e) {
        console.error("Error loading stream:", e);
        alert("Server Error: Please refresh or check if API is down.");
    }
}
</script>
</body>
</html>
