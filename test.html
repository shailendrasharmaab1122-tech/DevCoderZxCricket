<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live TV | Devansh Sharma</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/shaka-player.ui.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.6.0/controls.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { background: #000; height: 100%; width: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

        /* Premium Interface */
        .player-wrapper { width: 100%; height: 100%; position: relative; }
        video { width: 100%; height: 100%; object-fit: contain; }

        .header-info {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid #ff0000;
            backdrop-filter: blur(8px);
        }
        .status-dot {
            height: 10px; width: 10px;
            background: #ff0000; border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1.2s infinite;
        }
        .dev-name { color: #fff; font-size: 14px; }
        .dev-name span { color: #00f0ff; font-weight: bold; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="player-wrapper" id="container" data-shaka-player-container>
    <div class="header-info">
        <div class="status-dot"></div>
        <div class="dev-name">Live Stream | <span>Devansh Sharma</span></div>
    </div>
    <video id="video" data-shaka-player autoplay playsinline></video>
</div>

<script>
    // Config: Yahan hum channel ki ID pass karenge (e.g. ss2)
    const urlParams = new URLSearchParams(window.location.search);
    const channelID = urlParams.get('id') || 'ss2'; // Default ss2 agar URL mein na ho
    const API_SOURCE = "https://jiop.sportsstream.workers.dev/json";

    async function startLivePlayer() {
        const video = document.getElementById('video');
        const container = document.getElementById('container');
        const player = new shaka.Player(video);

        // UI Setup
        new shaka.ui.Overlay(player, container, video);

        // Network Request Filter (Headers injection)
        player.getNetworkingEngine().registerRequestFilter((type, request) => {
            request.headers['User-Agent'] = 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36';
            request.headers['Referer'] = 'https://www.jiotv.com/';
        });

        try {
            // 1. Fetching Fresh Link from API
            const response = await fetch(API_SOURCE);
            const data = await response.json();
            
            // 2. Finding specific channel data
            const channelData = data.find(c => c.name.toLowerCase() === channelID.toLowerCase());

            if (!channelData) {
                alert("Channel Not Found!");
                return;
            }

            // 3. DRM Configuration
            if (channelData.drmLicense) {
                const [keyId, key] = channelData.drmLicense.split(':');
                player.configure({
                    drm: {
                        clearKeys: { [keyId]: key }
                    }
                });
            }

            // 4. Load Stream
            // Agar link direct block hai toh ye proxy se try karega
            await player.load(channelData.link);
            console.log("Stream initialized successfully!");

        } catch (error) {
            console.error("Player Error:", error);
            // Vercel CORS bypass attempt
            if (error.code === 1001) {
                alert("CORS Error: Please use a CORS bypass extension or a server proxy.");
            }
        }
    }

    document.addEventListener('shaka-ui-loaded', startLivePlayer);
</script>

</body>
</html>
