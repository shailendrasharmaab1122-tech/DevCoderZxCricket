<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Live Stream Player | Clean Version</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css">
<style>
    body,html{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:sans-serif}
    #player_wrap{width:100%;height:100%;position:relative}
    video{width:100%;height:100%}
    
    /* Header Credits */
    .dev_header{
        position:absolute;top:15px;left:15px;z-index:10;
        background:rgba(0,0,0,0.7);padding:7px 15px;
        border-radius:50px;border:1px solid rgba(255,255,255,0.1);
        display:flex;align-items:center;pointer-events:none;
        backdrop-filter:blur(5px);
    }
    .live_dot{
        height:8px;width:8px;background:#00f0ff;
        border-radius:50%;margin-right:10px;
        box-shadow:0 0 10px #00f0ff;animation:blink_live 1.2s infinite;
    }
    .dev_name{color:#fff;font-size:12px;font-weight:600;letter-spacing:0.5px}
    .dev_name span{color:#00f0ff;font-weight:800}

    /* Clean Splash Screen */
    #splash_gate{position:absolute;inset:0;background:#080808;display:flex;justify-content:center;align-items:center;z-index:100}
    .play_btn_card{text-align:center;cursor:pointer;background:#111;padding:35px;border-radius:20px;border:1px solid #222;transition:0.3s}
    .play_btn_card:hover{border-color:#00f0ff;transform:scale(1.02)}
    .p_icon{font-size:40px;color:#fff;background:#1e40af;width:75px;height:75px;line-height:75px;border-radius:50%;margin-bottom:15px;display:inline-block;padding-left:5px}
    .p_label{color:#fff;font-size:15px;font-weight:600;display:block}

    @keyframes blink_live{0%,100%{opacity:1}50%{opacity:.3}}
    .shaka-spinner-container{display:none!important}
</style>
</head>
<body oncontextmenu="return false">

<div id="player_wrap" data-shaka-player-container>
    <div class="dev_header">
        <div class="live_dot"></div>
        <div class="dev_name">Developer <span>Devansh Sharma</span></div>
    </div>

    <div id="splash_gate">
        <div class="play_btn_card" id="start_trigger">
            <div class="p_icon">▶</div>
            <span class="p_label">TAP TO WATCH LIVE</span>
        </div>
    </div>

    <video id="main_player" data-shaka-player autoplay playsinline></video>
</div>

<script>
(function(){
    // Clean Config (No Redirects / No Ads)
    var _0xU = "aHR0cHM6Ly9qaW90dmJwa21vYi5jZG4uamlvLmNvbS9icGstdHYvU3Rhcl9TcG9ydHNfSEQxX0hpbmRpX0JUUy9vdXRwdXQvaW5kZXgubXBk"; 
    var _0xT = "c3Q9MTc3MjA4NzQwM35leHA9MTc3MjE3MzgwM35hY2w9Lyp+aG1hYz0yMGM4MGM5NjZlZDM5ZTViNWE5MGExZDA3MTcxNjk5NDI1MDZjZjBkMDMxYWNjYTlmOWZlMjkwODI5YTM5OTUz";
    var _0xK1 = "YjJjZjE1YmZkOTM4NDUyMTg4ZDQ1N2UzY2RjZTZlMDI=";
    var _0xK2 = "MmI1N2VjNDM3YjcyNTdiNWFmMTY1ZDYzNGFlMmJmYzc=";

    async function setupPlayer(){
        var vid = document.getElementById('main_player');
        var wrap = document.getElementById('player_wrap');
        var gate = document.getElementById('splash_gate');
        
        var p = new shaka.Player(vid);
        new shaka.ui.Overlay(p, wrap, vid);

        p.configure({
            drm: { clearKeys: { [atob(_0xK1)]: atob(_0xK2) } },
            streaming: { lowLatencyMode: true }
        });

        p.getNetworkingEngine().registerRequestFilter(function(type, request){
            request.headers['User-Agent'] = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36';
            request.headers['Referer'] = 'https://www.jiotv.com/';
            
            var token = atob(_0xT);
            var uri = request.uris[0];
            request.uris[0] = uri + (uri.includes('?') ? '&' : '?') + "__hdnea__=" + token;
        });

        document.getElementById('start_trigger').onclick = async function(){
            try {
                await p.load(atob(_0xU));
                gate.style.display = 'none';
                vid.play();
            } catch(e) {
                console.log("Error loading stream");
            }
        };
    }

    document.addEventListener('shaka-ui-loaded', setupPlayer);
})();
</script>
</body>
</html>
