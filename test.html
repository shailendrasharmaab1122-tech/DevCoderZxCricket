<style>

body { background: var(--bg-gradient); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; }

/* Player Styles */
#player-wrapper { width: 100%; max-width: 1000px; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
video { width: 100%; height: 100%; object-fit: contain; }
.dev-tag { position: absolute; top: 15px; left: 15px; z-index: 99; color: #fff; font-weight: bold; font-size: 12px; text-shadow: 0 0 10px #00d2ff; pointer-events: none; }
#unmute-shield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; cursor: pointer; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.1); color: white; font-size: 14px; text-shadow: 1px 1px 5px black; }

/* Info Section Styles */
.container { width: 100%; max-width: 1000px; margin-top: 15px; }
.stream-header { background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); border-radius: 12px; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
.live-badge { background: rgba(239,68,68,0.1); color: #dc2626; padding: 4px 12px; border-radius: 30px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 5px; }
.grid-panels { display: grid; gap: 15px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.info-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; text-align: center; }
.action-button { margin-top: 10px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 8px; padding: 12px; background: var(--accent-gradient); color: #fff; border-radius: 10px; font-weight: 600; text-decoration: none; border: none; cursor: pointer; transition: 0.3s; }

/* Popup */
.popup { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 99999; }
.popup-box { background: #fff; padding: 20px; max-width: 350px; width: 90%; border-radius: 16px; text-align: center; }
.popup-box button { margin-top: 10px; width: 100%; padding: 10px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; cursor: pointer; }
